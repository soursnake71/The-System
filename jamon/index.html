<!doctype html>
<html lang="en"><head>

<title>Jam-On Rig</title><meta name="theme-color" content="#14110f">
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Bangers&display=swap" rel="stylesheet">

<style>
:root{--bg:#14110f;--card:#1f1b18;--card2:#29231f;--ink:#efe6d8;--dim:#9c8f7d;--acc:#e8742b;--ok:#7fd;--line:#3a322b}
*{box-sizing:border-box}html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font:14px/1.35 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-tap-highlight-color:transparent}
body{display:flex;flex-direction:column;overscroll-behavior:none}
button,select,input,textarea{font:inherit;color:var(--ink);background:var(--card2);border:1px solid var(--line);border-radius:7px;padding:7px 10px;min-height:36px}
button{cursor:pointer;touch-action:manipulation}button.on{background:var(--acc);color:#1a1006;border-color:var(--acc)}
textarea{width:100%;resize:vertical}input[type=number]{width:70px}
header{position:sticky;top:0;z-index:5;background:linear-gradient(180deg,#221d19,#171310);border-bottom:1px solid var(--line);padding:calc(6px + env(safe-area-inset-top)) 10px 6px}
.top{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.logo{font:800 15px/1 system-ui;letter-spacing:.14em;color:var(--acc);margin-right:4px;white-space:nowrap}.logo small{color:var(--dim);font-weight:500;letter-spacing:.05em}
#playBtn{width:52px;font-size:18px}#recBtn.on{background:#d33;border-color:#d33;color:#fff}
#songSel{max-width:44vw}#posLbl{font:12px ui-monospace,monospace;color:var(--ok);min-width:80px}
.top label{display:flex;align-items:center;gap:4px;color:var(--dim);font-size:12px}
#tabs{display:flex;gap:4px;overflow-x:auto;padding:6px 0 2px;scrollbar-width:none}#tabs::-webkit-scrollbar{display:none}
#tabs button{flex:none;border-bottom:3px solid var(--c);padding:6px 11px}#tabs button.on{background:var(--c);color:#111;border-color:var(--c)}
main{flex:1;overflow-y:auto;padding:10px 10px calc(30px + env(safe-area-inset-bottom))}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px;margin:0 auto 10px;max-width:1100px}
h2{margin:0 0 4px;font-size:18px}h3{margin:4px 0 8px;font-size:15px}h3 small{color:var(--dim);font-weight:400}
.hint{color:var(--dim);font-size:12.5px;margin:6px 0 0}
.row{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin:6px 0}.row label{display:flex;gap:5px;align-items:center;color:var(--dim)}
.mach{border-top:4px solid var(--c)}.mhead{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}.maker{color:var(--dim);font-size:12px}
details summary{cursor:pointer;color:var(--dim);margin:6px 0}
.panel{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:8px}
fieldset{border:1px solid var(--line);border-radius:9px;margin:0;padding:6px 8px 8px;display:flex;flex-wrap:wrap;gap:4px 6px;align-content:start}
legend{color:var(--c,var(--acc));font-size:11px;text-transform:uppercase;letter-spacing:.08em;padding:0 4px}
.ctl{display:grid;grid-template-columns:80px 1fr 32px;align-items:center;gap:6px;width:100%;font-size:12.5px;color:var(--dim)}.ctl b{font:11px ui-monospace,monospace;color:var(--ink);text-align:right}
.ctl select{padding:4px 6px;min-height:30px}
input[type=range]{-webkit-appearance:none;appearance:none;background:transparent;height:28px;width:100%;padding:0;border:0}
input[type=range]::-webkit-slider-runnable-track{height:6px;border-radius:3px;background:#3d342c}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:20px;height:20px;border-radius:50%;background:var(--c,var(--acc));margin-top:-7px;border:2px solid #111}
.sw{padding:5px 9px;min-height:30px;font-size:12.5px}.sw.on{background:var(--c,var(--acc));border-color:var(--c,var(--acc))}
.secbar{display:flex;gap:5px;overflow-x:auto;padding-bottom:4px}.sec{flex:none;display:flex;flex-direction:column;align-items:flex-start;padding:5px 10px}.sec small{color:inherit;opacity:.7;font-size:11px}
.barsel{display:flex;gap:4px;margin:6px 0;flex-wrap:wrap}.barsel button{padding:4px 9px;min-height:30px}
.grid{display:flex;flex-direction:column;gap:2px;margin-top:6px}.gl{display:grid;grid-template-columns:72px repeat(16,minmax(0,1fr));gap:2px;align-items:center}
.gl span{font-size:11px;color:var(--dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.st{min-height:24px;height:24px;padding:0;border-radius:4px;background:#2a241f;border-color:#332b25}.st.beat{background:#342c25}
.drum .st.o{background:color-mix(in srgb,var(--c,var(--acc)) 55%,#000)}.drum .st.x{background:var(--acc)}
.roll .gl.blk .st{background:#211c18}.roll .gl.blk span{color:#6f6556}.roll .st{min-height:18px;height:18px}
.roll .st.nh{background:#e8b04a}.roll .st.nt{background:#9c7a3a;border-radius:0}.roll .st.acc{background:#ff5a2a}.roll .st.sl{box-shadow:inset -5px 0 #7fd}
.st.ph{outline:2px solid var(--ok);outline-offset:-2px}
.tools button{min-height:32px;padding:4px 10px}
.pads{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}.pad{min-height:58px;font-size:12px;background:#2d2621}.pad.hit{background:var(--acc);color:#111}
.kb{position:relative;height:150px;touch-action:none;user-select:none;margin-top:6px}
.key{position:absolute;top:0;border:1px solid #111;border-radius:0 0 6px 6px;font-size:10px;color:#555;display:flex;align-items:flex-end;justify-content:center;padding-bottom:4px}
.key.w{height:100%;background:#eee6d6;z-index:1}.key.b{height:62%;background:#1b1714;z-index:2}.key.on{background:var(--acc)!important}
.secrow{display:flex;flex-wrap:wrap;gap:6px;align-items:center;padding:8px;border:1px solid var(--line);border-radius:9px;margin-bottom:6px}.secrow.on{border-color:var(--acc)}
.secrow input{width:130px}.secrow label{display:flex;gap:4px;align-items:center;color:var(--dim)}.secrow .acts{margin-left:auto;display:flex;gap:4px}
.parts{display:flex;flex-wrap:wrap;gap:3px;flex-basis:100%}.parts i{font-style:normal;font-size:11px;padding:1px 6px;border-radius:9px;border:1px solid var(--c);color:var(--c)}
.chmap{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:6px}.chmap label{display:flex;justify-content:space-between;align-items:center;gap:6px;color:var(--dim);font-size:12.5px}
.bands{display:grid;grid-template-columns:repeat(14,1fr);gap:3px;height:90px;margin:10px 0}.bands div{display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:2px;height:100%}
.bands i{display:block;width:100%;background:linear-gradient(0deg,#2bb,#7fd);border-radius:2px;height:2%;transition:height .06s}.bands span{font-size:9px;color:var(--dim)}
.sayrow{display:flex;gap:6px;margin-bottom:5px}.sayrow input{flex:1}
.big{font-size:16px;padding:10px 18px;background:var(--ok);color:#06201d;border-color:var(--ok)}
.mixer{display:grid;grid-template-columns:repeat(auto-fill,minmax(104px,1fr));gap:8px}
.strip{border:1px solid var(--line);border-top:3px solid var(--c);border-radius:9px;padding:8px;display:flex;flex-direction:column;gap:6px;align-items:stretch}.strip b{font-size:12px}
.strip label{font-size:11px;color:var(--dim)}.strip small{color:var(--ok);font-size:11px}.ms{display:flex;gap:4px}.ms button{flex:1;min-height:32px}
.master{max-width:420px;margin-top:12px;grid-template-columns:80px 1fr}
.improw{display:flex;justify-content:space-between;align-items:center;gap:8px;margin:5px 0;font-size:13px}
dialog{background:var(--card);color:var(--ink);border:1px solid var(--line);border-radius:12px;max-width:min(560px,94vw);width:100%}dialog::backdrop{background:#000a}
#toast{position:fixed;left:50%;bottom:calc(18px + env(safe-area-inset-bottom));transform:translate(-50%,20px);opacity:0;background:#2d2621;border:1px solid var(--acc);padding:9px 14px;border-radius:10px;transition:.2s;z-index:20;max-width:92vw;pointer-events:none}
#toast.on{opacity:1;transform:translate(-50%,0)}
#busy{position:fixed;inset:0;background:#000b;display:none;align-items:center;justify-content:center;z-index:30;font-size:16px}#busy.on{display:flex}
@media (max-width:520px){.gl{grid-template-columns:52px repeat(16,minmax(0,1fr))}.ctl{grid-template-columns:70px 1fr 28px}.panel{grid-template-columns:1fr}#songSel{max-width:60vw}}

/* compact layout: one header row, knobs, one view at a time on phones */
header{padding:calc(4px + env(safe-area-inset-top)) 8px 4px;position:sticky}
.top{flex-wrap:nowrap}.logo{font-size:13px;margin-right:0}
#songSel{flex:1;min-width:0;max-width:none}#bpm{width:58px}#playBtn{width:46px;font-size:16px}#moreBtn{width:40px;padding:0}
.top.more{display:none;flex-wrap:wrap;margin-top:4px}.top.more.on{display:flex}
#tabs{padding:4px 0 0}#tabs button{padding:5px 9px;min-height:32px;font-size:13px}
#posLbl{position:absolute;right:10px;top:calc(100% + 2px);font-size:11px;background:#14110fcc;padding:1px 6px;border-radius:6px;pointer-events:none}
main{padding:8px 8px calc(20px + env(safe-area-inset-bottom))}.card{padding:10px;margin-bottom:8px}
.mhead{align-items:center}.mhead h2{font-size:16px;margin:0}
.vtabs{display:flex;gap:4px;margin-left:auto}.vtabs button{min-height:32px;padding:4px 12px}.vtabs button.on{background:var(--c,var(--acc));border-color:var(--c,var(--acc));color:#111}
.vw{display:none;margin-top:8px}.vw.on{display:block}
.chips{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none;margin:6px 0 4px}.chips::-webkit-scrollbar{display:none}.chips button{flex:none;min-height:30px;padding:3px 10px;font-size:12.5px}
.chips button.on{background:var(--c,var(--acc));border-color:var(--c,var(--acc));color:#111}
.panel{display:block}.grp{display:none;border:0;padding:0}.grp.on{display:block}.grp legend{display:none}
.knobs{display:grid;grid-template-columns:repeat(auto-fill,minmax(70px,1fr));gap:6px 4px;align-items:start}
.knob{display:flex;flex-direction:column;align-items:center;touch-action:none;user-select:none;cursor:ns-resize;outline:none}
.knob svg{width:52px;height:52px}.knob path{fill:none;stroke-width:4;stroke-linecap:round}.knob .kt{stroke:#3d342c}.knob .kv{stroke:var(--c,var(--acc))}
.knob line{stroke:var(--ink);stroke-width:3;stroke-linecap:round}.knob b{font:10px ui-monospace,monospace;margin-top:-6px}.knob span{font-size:11px;color:var(--dim);text-align:center;line-height:1.15}
.knob.drag svg,.knob:focus-visible svg{filter:drop-shadow(0 0 4px var(--c,var(--acc)))}
.knobs .sw{align-self:center;min-height:34px}.selc{display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;color:var(--dim)}.selc select{min-height:34px;padding:3px 6px;max-width:100%}
.kb{height:min(46vh,260px)}.pads .pad{min-height:min(11vh,80px)}
.roll .st{min-height:16px;height:16px}.st{min-height:22px;height:22px}
@media (min-width:900px){
  .vtabs{display:none}.vw{display:block}.mach{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);gap:0 16px}.mach .mhead{grid-column:1/-1}
  .mach .vw[data-v="play"]{grid-column:1/-1}.grp{display:block;margin-bottom:6px}.grp legend{display:block}.chips{display:none}
}
.fold summary{cursor:pointer;list-style:none}.fold summary::-webkit-details-marker{display:none}.fold summary h3{display:inline;margin:0}.fold summary::after{content:" ▾";color:var(--dim)}.fold[open] summary::after{content:" ▴"}
.secrow{padding:6px;gap:4px;margin-bottom:4px}.secrow input{width:110px;min-height:32px}.secrow select,.secrow button{min-height:32px;padding:3px 8px}.parts{gap:2px}.parts i{font-size:10px}
.secrow{flex-wrap:nowrap}.secrow input{flex:1;min-width:0;width:auto}.secrow .acts{margin-left:0;flex:none}.secrow .acts button{width:34px;padding:0}
.secrow .parts{display:none}@media (min-width:700px){.secrow{flex-wrap:wrap}.secrow .parts{display:flex}}
.card h2+.hint+.row button{min-height:32px;padding:4px 9px;font-size:13px}
#tabs button{display:flex;flex-direction:column;align-items:center;gap:1px;padding:3px 7px 4px;min-width:62px}#tabs .gear{width:52px;height:28px;display:block}#tabs button span{font-size:11.5px;line-height:1.1}
.mhead .gear.hero{width:92px;height:49px;flex:none;filter:drop-shadow(0 2px 3px #0008)}.mtitle{display:flex;flex-direction:column;min-width:0}.mtitle .maker{font-size:11.5px}
@media (min-width:900px){.mhead .gear.hero{width:150px;height:80px}}
@media (max-width:520px){#editor>.hint{display:none}.mhead .gear.hero{width:76px;height:41px}}

/* hardware panels: each machine's colours, its knob caps, sliders and switch kinds */
.panel{background:var(--pbg,transparent);color:var(--pink,var(--ink));border-radius:10px;padding:8px 8px 10px}
.panel .chips button{background:#0003;color:var(--pink,var(--ink));border-color:#0004}.panel .chips button.on{background:var(--c);color:#111}
.panel .grp legend{color:var(--pink);opacity:.8}.knob span,.fader span,.seg>span{color:var(--pink,var(--dim));opacity:.85}.knob b,.fader b{color:var(--pink,var(--ink));opacity:.7}
.knob .kt{stroke:var(--kr,#3d342c)}.knob .kv{stroke:var(--c)}.knob svg{overflow:visible}
.knob svg::before{content:none}.knob circle.body{fill:var(--kb)}
.knob line{stroke:var(--kp,var(--ink))}
.fader{display:flex;flex-direction:column;align-items:center;touch-action:none;user-select:none;cursor:ns-resize;outline:none}
.ftrack{position:relative;width:26px;height:96px}.ftrack::before{content:"";position:absolute;left:50%;top:4px;bottom:4px;width:4px;margin-left:-2px;background:var(--track,#000);border-radius:2px;box-shadow:inset 0 0 0 1px #0006}
.ftrack i{position:absolute;left:1px;width:24px;height:12px;background:var(--cap,#eee);border-radius:2px;box-shadow:0 2px 3px #0009,inset 0 -3px #0002}
.ftrack i::after{content:"";position:absolute;left:3px;right:3px;top:5px;height:2px;background:#0007}
.fader.drag .ftrack i,.fader:focus-visible .ftrack i{outline:2px solid var(--c)}
.seg{display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11px}.seg>div{display:flex;border:1px solid #0006;border-radius:6px;overflow:hidden;background:#0003}
.seg button{min-height:30px;padding:2px 7px;border:0;border-radius:0;background:transparent;color:var(--pink,var(--ink));font-size:11.5px}.seg button.on{background:var(--c);color:#111}
.sw{display:flex;flex-direction:column;align-items:center;gap:3px;background:transparent;border:0;color:var(--pink,var(--ink));font-size:11px;padding:2px;min-height:0}
.sw i{display:block}.sw.on{background:transparent;color:var(--pink,var(--ink))}
.sw-btn i{width:30px;height:18px;border-radius:4px;background:#3a3a3a;border:1px solid #000}.sw-btn.on i{background:var(--c)}
.sw-rocker i{width:18px;height:28px;border-radius:3px;background:linear-gradient(#f4f4f4 0 50%,#2b2b2b 50%);border:1px solid #000;box-shadow:0 1px 2px #000}
.sw-rocker.on i{background:linear-gradient(#2b2b2b 0 50%,#f4f4f4 50%)}
.sw-tab i{width:22px;height:30px;border-radius:3px 3px 6px 6px;background:#efe9da;border:1px solid #000;transform:perspective(60px) rotateX(18deg);box-shadow:0 3px 0 #0008}
.sw-tab.on i{background:#e6b23a;transform:perspective(60px) rotateX(-18deg);box-shadow:0 -1px 0 #0008}
.sw-led i{width:34px;height:20px;border-radius:3px;background:#d9d6cc;border:1px solid #000;position:relative}.sw-led i::after{content:"";position:absolute;top:-7px;left:50%;margin-left:-3px;width:6px;height:6px;border-radius:50%;background:#400}
.sw-led.on i::after{background:#ff3b20;box-shadow:0 0 6px #ff3b20}
.sw-slide i{width:16px;height:30px;border-radius:3px;background:#1e2328;position:relative}.sw-slide i::after{content:"";position:absolute;left:2px;right:2px;height:12px;bottom:2px;background:#e9e9e9;border-radius:2px;transition:.1s}.sw-slide.on i::after{bottom:16px}
/* MIDI learn */
body.learning [data-learn]{outline:2px dashed #7fd8;outline-offset:2px;cursor:crosshair}
body.learning .learn-sel{outline:3px solid #7fd!important;animation:lpulse .8s infinite alternate}
@keyframes lpulse{to{outline-color:#7fd3}}
[data-learn].mapped{position:relative}[data-learn].mapped::after{content:"";position:absolute;top:-2px;right:-2px;width:7px;height:7px;border-radius:50%;background:#7fd;box-shadow:0 0 4px #7fd}
#learnBtn.on{background:#7fd;color:#06201d;border-color:#7fd}
.grow{flex:1}
.fader b{margin-top:4px}.seg{grid-column:span 2;justify-self:center}.knobs .seg>div{max-width:100%;overflow-x:auto}

/* look of the 1984 cover style: comic-book red block lettering, sunset sky, desert sand (no artwork included) */
:root{--sky1:#f7e25a;--sky2:#f29a4a;--sky3:#c0478f;--sky4:#5b3d9a;--sand:#e7c38a;--red:#e3262b}
.comic{font-family:Bangers,Impact,"Arial Black",system-ui,sans-serif;letter-spacing:.06em;color:var(--red);-webkit-text-stroke:1px #111;text-shadow:2px 2px 0 #111,3px 3px 0 var(--sky1)}
header{background:linear-gradient(100deg,var(--sky1) 0%,var(--sky2) 30%,var(--sky3) 65%,var(--sky4) 100%);border-bottom:3px solid #111}
header .logo.comic{font-size:22px;line-height:1;transform:skew(-6deg)}
header button,header select,header input{background:#14110fd9;border-color:#111}
#tabs button{background:#14110fe0}
.card{border-color:#3a322b;box-shadow:0 0 0 1px #0006}
.mhead h2{font-family:Bangers,Impact,system-ui,sans-serif;letter-spacing:.06em;font-weight:400;font-size:20px;color:var(--sand)}
body.has-art::before{content:"";position:fixed;inset:0;background:var(--backdrop) center/cover no-repeat;opacity:.16;filter:saturate(1.2);z-index:-1;pointer-events:none}
body.has-art{background:#14110fe8}
.about h2.comic{font-size:28px;margin-bottom:8px}
.artgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px}.artslot{margin:0}
.artimg{aspect-ratio:1;background:#0004;border:2px dashed #555;border-radius:8px;display:flex;align-items:center;justify-content:center;overflow:hidden}.artimg img{width:100%;height:100%;object-fit:cover}
.artslot figcaption{font-size:12.5px;color:var(--dim);margin:6px 0}
.dubgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:6px;margin-top:8px}
.dubcell{display:grid;grid-template-columns:1fr 1fr;gap:4px;border:1px solid var(--line);border-top:3px solid var(--c);border-radius:8px;padding:6px}.dubcell b{grid-column:1/-1;font-size:12px}
.dub{min-height:48px;touch-action:none;user-select:none;font-weight:600}.dub.thr.on{background:#7fd;color:#06201d}.dub.drp.on{background:#d33;color:#fff}
.inssel>div{flex-wrap:wrap}.chlist button{font-size:12px}
.mixer.rets{grid-template-columns:repeat(auto-fill,minmax(90px,1fr))}
.mixer{display:flex!important;gap:6px;overflow-x:auto;padding-bottom:6px;scroll-snap-type:x proximity}.mixer .strip{flex:none;width:86px;scroll-snap-align:start}
.mixer .strip .fader{writing-mode:vertical-lr;direction:rtl;height:150px;width:30px;align-self:center}
.mixer.rets{margin-top:8px;align-items:stretch}.retlbl{writing-mode:vertical-lr;transform:rotate(180deg);color:var(--dim);font-size:11px;letter-spacing:.1em}
#helpBtn{width:36px;padding:0;font-weight:700}.help .helpbody{font-size:14px;line-height:1.5}.help .helpbody li{margin:4px 0}.help summary h3{font-size:15px}
</style></head>
<body>
<header>
  <div class="top">
    <span class="logo comic">JAM-ON</span>
    <button id="playBtn" title="Play / stop (space)" data-learn="play">▶</button>
    <select id="songSel"></select>
    <input id="bpm" type="number" min="40" max="240" title="BPM" aria-label="BPM">
    <button id="helpBtn" title="Help for this screen" aria-label="Help">?</button><button id="moreBtn" title="More">⋯</button>
  </div>
  <div class="top more" id="more">
    <label>Swing<input id="swing" type="number" min="0" max="60"></label>
    <button id="loopBtn" title="Loop the section being edited" data-learn="loop">Loop sec</button>
    <button id="learnBtn" title="MIDI Learn">Learn</button>
    <button id="recNotesBtn" title="Write played notes into the playing section">● Notes</button>
    <button id="recBtn" title="Record the output to WAV">REC</button>
    <button id="panicBtn" title="All notes off">Panic</button>
    <span id="midiStat" class="hint"></span>
  </div>
  <nav id="tabs"></nav><span id="posLbl"></span>
</header>
<main id="main"></main>
<dialog id="impDlg"><h3>Import MIDI</h3><p id="impInfo" class="hint"></p><div id="impRows"></div>
  <p class="hint">Pick the machine for each track. Notes land on the nearest 16th; drums follow General MIDI note numbers.</p>
  <div class="row"><button id="impOk" class="on">Import as a new song</button><button id="impCancel">Cancel</button></div></dialog>
<input id="artFile" type="file" accept="image/*" hidden><input id="midFile" type="file" accept=".mid,.midi,audio/midi" hidden><input id="projFile" type="file" accept=".json,application/json" hidden>
<div id="toast"></div><div id="busy"></div>
<script src="dsp/drums.js"></script><script src="dsp/tts.js"></script><script src="midi.js"></script><script src="gear.js"></script><script src="presets.js"></script><script src="fx.js"></script><script src="songs.js"></script><script src="help.js"></script><script src="app.js"></script>
