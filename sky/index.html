<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>Sky Sequencer</title><meta name="theme-color" content="#04100c">
<link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="icon.svg"><link rel="apple-touch-icon" href="icon-192.png">
<style>
:root{--bg:#030b08;--card:#08170f;--card2:#0e2219;--ink:#dcf7ea;--dim:#7fa292;--acc:#4dffa6;--line:#1c3a2c;--bad:#ff6b5e}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font:14px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-tap-highlight-color:transparent}
button,select,input{font:inherit;color:var(--ink);background:var(--card2);border:1px solid var(--line);border-radius:7px;padding:6px 10px;min-height:36px}
button{cursor:pointer;touch-action:manipulation}button.on{background:var(--acc);color:#02140b;border-color:var(--acc)}
input[type=number]{width:105px}
header{position:sticky;top:0;z-index:5;background:linear-gradient(180deg,#0a1e15,#051109);border-bottom:1px solid var(--line);padding:calc(6px + env(safe-area-inset-top)) 10px 6px}
.top{display:flex;gap:6px;align-items:center;flex-wrap:wrap;max-width:1100px;margin:0 auto}
.logo{font:800 14px/1 ui-monospace,monospace;letter-spacing:.16em;color:var(--acc);margin-right:auto;white-space:nowrap}
#play{width:52px;font-size:17px}#rec{width:46px;color:#ff6b5e}#rec.on{background:#e33;border-color:#e33;color:#fff}
#bpm{width:64px}.top label{display:flex;align-items:center;gap:4px;color:var(--dim);font-size:12px}
main{max-width:1100px;margin:0 auto;padding:10px 10px calc(30px + env(safe-area-inset-bottom));display:grid;gap:10px;grid-template-columns:minmax(0,1fr)}
@media (min-width:900px){main{grid-template-columns:minmax(0,560px) minmax(0,1fr);align-items:start}#scope{position:sticky;top:64px}}
#radar{width:100%;aspect-ratio:1;display:block;border-radius:12px;border:1px solid var(--line);background:#04100c;touch-action:manipulation}
.status{font:12px ui-monospace,monospace;color:var(--acc);margin:6px 2px}.status.bad{color:var(--bad);font-family:inherit}.status button{margin-left:6px;min-height:30px;padding:3px 9px}
#legend{display:flex;flex-wrap:wrap;gap:4px 10px;font-size:12px;color:var(--dim);margin:4px 2px}#legend i{display:inline-block;width:9px;height:9px;border-radius:50%;background:var(--c);margin-right:4px}#legend b{color:var(--ink);font-weight:600}
#where{display:block;width:100%;text-align:left;background:none;border:0;color:var(--ink);padding:2px 2px 6px;min-height:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.results{display:flex;flex-direction:column;gap:4px;margin:4px 0}.results button{text-align:left;font-size:12.5px}
#sel{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:8px 10px;margin-top:6px;font-size:13px}#sel span{color:var(--dim)}
#tabs{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none;margin-bottom:8px}#tabs::-webkit-scrollbar{display:none}#tabs button{flex:none}
.lane{background:var(--card);border:1px solid var(--line);border-top:3px solid var(--c,var(--line));border-radius:12px;padding:10px 12px;margin-bottom:8px}
.lhead{display:flex;align-items:center;justify-content:space-between;gap:8px}
h3{margin:2px 0 4px;font-size:15px;color:var(--c,var(--ink))}h3 small{color:var(--dim);font-weight:400}
.hint{color:var(--dim);font-size:12.5px;margin:4px 0}
.row{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin:6px 0}.row label{display:flex;gap:5px;align-items:center;color:var(--dim)}
.ctl{display:grid;grid-template-columns:72px 1fr 52px;align-items:center;gap:6px;font-size:12.5px;color:var(--dim)}.ctl b{font:11px ui-monospace,monospace;color:var(--ink);text-align:right}
input[type=range]{-webkit-appearance:none;appearance:none;background:transparent;height:28px;width:100%;padding:0;border:0;min-height:0}
input[type=range]::-webkit-slider-runnable-track{height:5px;border-radius:3px;background:#1d3a2d}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:18px;height:18px;border-radius:50%;background:var(--c,var(--acc));margin-top:-6.5px;border:2px solid #02140b}
input[type=range]::-moz-range-track{height:5px;border-radius:3px;background:#1d3a2d}input[type=range]::-moz-range-thumb{width:16px;height:16px;border-radius:50%;background:var(--c,var(--acc));border:2px solid #02140b}
.sw{min-height:32px;padding:4px 12px}.sw.on{background:var(--c,var(--acc));border-color:var(--c,var(--acc));color:#02140b}
table{width:100%;border-collapse:collapse;font-size:12.5px}th{text-align:left;color:var(--dim);font-weight:500;padding:4px}td{padding:5px 4px;border-top:1px solid var(--line);font-family:ui-monospace,monospace}tr[data-id]{cursor:pointer}
#toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom));transform:translateX(-50%);background:#0e2a1d;border:1px solid var(--acc);border-radius:9px;padding:8px 14px;z-index:9;max-width:90vw}
</style></head><body>
<header><div class="top">
  <span class="logo">✈ SKY SEQUENCER</span>
  <button id="play" title="Play / stop (space)">▶</button>
  <button id="rec" title="Record to a MIDI file">●</button>
  <label>BPM <input id="bpm" type="number" min="40" max="220"></label>
  <label>Key <select id="key"></select></label>
  <select id="scale" aria-label="Scale"></select>
</div></header>
<main>
  <section id="scope">
    <button id="where" class="where"></button>
    <canvas id="radar"></canvas>
    <div id="status" class="status"></div>
    <div id="legend"></div>
    <div id="sel" hidden></div>
  </section>
  <section>
    <div id="tabs">
      <button data-t="lanes" class="on">Lanes</button><button data-t="presets">Presets</button><button data-t="synth">OB-Xa</button><button data-t="drums">Drums &amp; FX</button><button data-t="sky">Sky</button><button data-t="midi">MIDI</button><button data-t="planes">Planes</button><button data-t="about">About</button>
    </div>
    <div id="panel"></div>
  </section>
</main>
<div id="toast" hidden></div>
<script src="presets.js"></script><script src="feed.js"></script><script src="sound.js"></script><script src="app.js"></script>
</body></html>
