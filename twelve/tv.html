<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Omega Twelve TV</title>
<meta name="theme-color" content="#0b0e0d">
<style>
:root{ --bg:#141615; --panel:#c7c9cb; --lcd:#0b0e0d; --glow:#7dffb0; --dim:#3d8a62; --line:#1f2a25; --accent:#e2a83a; --ink:#1d1f22; --mute:#55595f; }
*{box-sizing:border-box}
html,body{margin:0; height:100%; background:var(--bg); color:#e8e8e8; font:16px/1.3 "Helvetica Neue", Arial, sans-serif; overflow:hidden}
.screen{display:grid; grid-template-columns:1.55fr 1fr; grid-template-rows:auto 1fr auto; gap:1.2vw; padding:1.6vw; height:100vh}
.top{grid-column:1 / -1; display:flex; align-items:baseline; gap:2vw}
.brand{font:700 2.2vw/1 Arial, sans-serif; letter-spacing:-.05vw; color:#d4d6d8}
.preset{font:400 2.4vw/1 ui-monospace, Menlo, monospace; color:var(--lcd); background:var(--glow); padding:.4vw .9vw; border-radius:.3vw; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; max-width:60vw}
.status{margin-left:auto; font:1.1vw ui-monospace, monospace; color:var(--dim)}
.status b{color:var(--glow); font-weight:400}
.lcd{background:var(--lcd); border:.5vw solid #2a2c2e; border-radius:.6vw; padding:1vw 1.3vw; display:flex; flex-direction:column; gap:.8vw; font-family:ui-monospace, Menlo, monospace; min-height:0}
.row{display:grid; grid-template-columns:1.5fr 1fr 1fr 1fr; gap:.8vw}
.cell span{display:block; font-size:.8vw; color:var(--dim); letter-spacing:.1vw}
.cell b{font-size:2.6vw; font-weight:400; color:var(--glow); white-space:nowrap}
.cell b.hi{background:var(--glow); color:var(--lcd); padding:0 .4vw}
.info{display:flex; flex-wrap:wrap; gap:.3vw 1.6vw; font-size:1.05vw; color:var(--dim); border-top:1px solid var(--line); padding-top:.6vw}
.info i{font-style:normal; color:var(--glow)}
.wave{flex:1; min-height:0; position:relative; border:1px solid var(--line)}
.wave canvas{position:absolute; inset:0; width:100%; height:100%}
.side{display:flex; flex-direction:column; gap:1vw; min-height:0}
.focus{background:var(--panel); color:var(--ink); border-radius:.8vw; padding:1vw 1.4vw; display:flex; align-items:center; gap:1.6vw; min-height:9vw}
.focus svg{width:7vw; height:7vw; flex:none}
.focus .name{font:700 1.2vw Arial; letter-spacing:.15vw; text-transform:uppercase; color:var(--mute)}
.focus .val{font:700 3.6vw/1.1 ui-monospace, Menlo, monospace}
.groups{display:grid; grid-template-columns:1fr 1fr 1fr; gap:.6vw; overflow:hidden; flex:1; min-height:0; align-content:start}
.grp{background:#1d201f; border-radius:.6vw; padding:.6vw .8vw}
.grp h3{margin:0 0 .3vw; font:700 .75vw Arial; letter-spacing:.15vw; color:#8f9297; text-transform:uppercase}
.kv{display:flex; justify-content:space-between; gap:.4vw; font:.82vw ui-monospace, monospace; color:#c8ccd6; padding:.05vw 0; border-radius:.2vw}
.kv b{font-weight:400; color:var(--glow); white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.kv span{white-space:nowrap}
.kv.hot{background:#2c3a32}
.bottom{grid-column:1 / -1; display:grid; grid-template-columns:1.55fr 1fr; gap:1.2vw; height:20vh}
.pads{display:grid; grid-template-columns:repeat(8, 1fr); grid-template-rows:1fr 1fr; gap:.6vw}
.pad{border-radius:.5vw; background:linear-gradient(#4a4d52, #2c2e32); display:flex; align-items:flex-end; padding:.4vw; font:700 1vw Arial; color:#bbb; transition:background .25s}
.pad.hit{background:linear-gradient(#ffcc6a, var(--accent)); color:#222; transition:none}
.eq{background:var(--lcd); border-radius:.6vw; position:relative}
.eq canvas{position:absolute; inset:0; width:100%; height:100%}
.wait{position:fixed; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:1vw; background:var(--bg); font-size:1.6vw; color:#aaa; text-align:center; padding:4vw}
.wait b{font-size:3vw; color:var(--glow)}
.wait.hide{display:none}
.mute{color:#666}
</style>
</head>
<body>
<div class="screen">
  <div class="top"><div class="brand">OMEGA TWELVE</div><div class="preset" id="preset">—</div><div class="status" id="status"></div></div>
  <div class="lcd">
    <div class="row">
      <div class="cell"><span>SAMPLER</span><b class="hi" id="m">—</b></div>
      <div class="cell"><span>BITS</span><b id="bits">—</b></div>
      <div class="cell"><span>RATE</span><b id="rate">—</b></div>
      <div class="cell"><span>TUNE</span><b id="tune">—</b></div>
    </div>
    <div class="row">
      <div class="cell"><span>FILTER</span><b class="hi" id="ft">—</b></div>
      <div class="cell"><span>CUTOFF</span><b id="cut">—</b></div>
      <div class="cell"><span>RESONANCE</span><b id="res">—</b></div>
      <div class="cell"><span>MIX</span><b id="mix">—</b></div>
    </div>
    <div class="info" id="info"></div>
    <div class="wave"><canvas id="wave"></canvas></div>
  </div>
  <div class="side">
    <div class="focus"><svg viewBox="0 0 52 52"><circle cx="26" cy="26" r="23" fill="#2b2d30" opacity=".18"/><path id="farc" fill="none" stroke="#e2a83a" stroke-width="3" stroke-linecap="round"/><circle cx="26" cy="26" r="17" fill="#f1efea" stroke="#8f9297" stroke-width=".8"/><line id="find" x1="26" y1="26" x2="26" y2="12" stroke="#d8402f" stroke-width="2.6" stroke-linecap="round"/></svg>
      <div><div class="name" id="fname">Turn a knob on your phone</div><div class="val" id="fval"></div></div></div>
    <div class="groups" id="groups"></div>
  </div>
  <div class="bottom"><div class="pads" id="pads"></div><div class="eq"><canvas id="eq"></canvas></div></div>
</div>
<div class="wait" id="wait"><b>OMEGA TWELVE · TV</b><div id="waitMsg">Waiting for the app… On your phone or computer open Omega Twelve and tap 📺 TV.</div></div>
<script src="engine.js"></script>
<script src="tvview.js"></script>
</body>
</html>
