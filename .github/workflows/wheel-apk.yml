# Builds Omega Wheel of Steel for Android (native C++ engine from plugins/wheel + the turntable UI in android/wheel)
# and attaches the APK to the "wheel-latest" release. Debug-signed, so it installs on your own phone without a key.
name: Wheel of Steel APK
on:
  push:
    branches: [main]
    paths: ['android/wheel/**', 'plugins/wheel/**', '.github/workflows/wheel-apk.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '17'}
      - uses: gradle/actions/setup-gradle@v4
        with: {gradle-version: '8.14.3'}
      - name: Build
        run: |
          # the runner image ships with the Android SDK; add the NDK + CMake the engine needs and point Gradle at it
          export ANDROID_HOME="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" --install 'ndk;27.2.12479018' 'cmake;3.22.1' 'platforms;android-35' 'build-tools;35.0.0' >/dev/null
          echo "sdk.dir=$ANDROID_HOME" > android/local.properties
          gradle -p android :wheel:assembleDebug --no-daemon
      - name: Publish
        env: {GH_TOKEN: '${{ github.token }}'}
        run: |
          cp android/wheel/build/outputs/apk/debug/wheel-debug.apk wheel-of-steel.apk
          gh release view wheel-latest >/dev/null 2>&1 || gh release create wheel-latest --title "Omega Wheel of Steel (latest)" --notes "Android app: two turntables and a scratch mixer, played by touch or from an MPC. Download wheel-of-steel.apk on your phone and open it to install (allow installs from your browser when Android asks)."
          gh release upload wheel-latest wheel-of-steel.apk --clobber
