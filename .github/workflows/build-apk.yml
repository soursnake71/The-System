name: Build The F.A.R.P. APK

on:
  push:
    branches: [farp-android]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build APK
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: Rename
        run: cp app/build/outputs/apk/release/app-release.apk FARP.apk

      - uses: actions/upload-artifact@v4
        with:
          name: FARP-Android-APK
          path: FARP.apk

      - name: Publish to the Releases page (direct phone download)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view farp-latest >/dev/null 2>&1; then
            gh release upload farp-latest FARP.apk --clobber
          else
            gh release create farp-latest FARP.apk --target farp-android \
              --title "The F.A.R.P. for Android" \
              --notes "Tap FARP.apk on your phone to download and install it."
          fi
