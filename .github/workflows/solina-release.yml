# Omega Solina: the VST3 (and AU on Mac) plus the standalone app for Windows, macOS and Linux, and the Android APK,
# all attached to the "omega-solina" release. Runs on main and on claude/* and ccr-* branches so builds can be tried before merging.
name: Omega Solina release
on:
  push:
    branches: [main, 'claude/**', 'ccr-**']
    paths: ['solina/**', 'plugins/solina/**', 'plugins/CMakeLists.txt', 'android/**', '.github/workflows/solina-release.yml']
  workflow_dispatch:
permissions:
  contents: write
env:
  VERSION: '1.0.${{ github.run_number }}'
jobs:
  plugins:
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: windows-latest, name: Windows}
          - {os: macos-latest, name: Mac}
          - {os: ubuntu-22.04, name: Linux}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Linux libraries
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev libx11-dev libxinerama-dev libxext-dev libxrandr-dev libxcursor-dev libfreetype6-dev libfontconfig1-dev libgl1-mesa-dev xvfb
      - name: Check the generated tables match the app
        if: runner.os == 'Linux'
        run: node solina/tools/gen.mjs && git diff --exit-code plugins/solina/Params.inc plugins/solina/Presets.inc
      - name: Configure
        run: cmake -S plugins -B build -DCMAKE_BUILD_TYPE=Release "-DOMEGA_ONLY=Solina"
      - name: Build
        run: cmake --build build --config Release --parallel 4 --target OmegaSolina_All solina_test
      - name: Test (C++ engine against the app's engine.js, then the processor)
        if: runner.os == 'Linux'
        run: |
          node solina/tools/compare.mjs build/solina_test "$RUNNER_TEMP"
          cmake --build build --config Release --parallel 4 --target solina_proc_test
          xvfb-run -a build/solina_proc_test_artefacts/Release/solina_proc_test "$RUNNER_TEMP"
      - name: Collect
        shell: bash
        run: |
          mkdir -p out
          find build -path '*Release/VST3/*.vst3' -prune -exec cp -R {} out/ \;
          find build -path '*Release/Standalone/*' -prune \( -name 'Omega Solina' -o -name 'Omega Solina.exe' -o -name 'Omega Solina.app' \) -exec cp -R {} out/ \;
          if [ "$RUNNER_OS" = macOS ]; then
            find build -path '*Release/AU/*.component' -prune -exec cp -R {} out/ \;
            for b in out/*; do codesign --force --deep -s - "$b"; done
          fi
          ls -la out
          cd out && 7z a -tzip "../Omega-Solina-${{ matrix.name }}.zip" . >/dev/null
      - uses: actions/upload-artifact@v4
        with: {name: 'solina-${{ matrix.name }}', path: 'Omega-Solina-${{ matrix.name }}.zip', if-no-files-found: error}
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '17'}
      - uses: gradle/actions/setup-gradle@v4
        with: {gradle-version: '8.14.3'}
      - name: Build
        run: |
          export ANDROID_HOME="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          echo "sdk.dir=$ANDROID_HOME" > android/local.properties
          gradle -p android assembleSolinaDebug --no-daemon
          cp android/app/build/outputs/apk/solina/debug/app-solina-debug.apk omega-solina.apk
      - uses: actions/upload-artifact@v4
        with: {name: solina-Android, path: omega-solina.apk, if-no-files-found: error}
  publish:
    needs: [plugins, apk]
    # publish whatever built: a Mac runner that never starts shouldn't hold back the Windows, Linux and Android files
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with: {path: dl, merge-multiple: true}
      - name: Release
        env: {GH_TOKEN: '${{ github.token }}', GH_REPO: '${{ github.repository }}'}
        run: |
          ls -la dl
          notes="Omega Solina $VERSION (from ${GITHUB_REF_NAME}, ${GITHUB_SHA::7}).

          - Android: open omega-solina.apk on the phone and allow installing from your browser or files app. Works offline; USB and Bluetooth MIDI in and out.
          - Windows / Mac / Linux: unzip and copy Omega Solina.vst3 into your VST3 folder (Windows C:\\Program Files\\Common Files\\VST3, Mac /Library/Audio/Plug-Ins/VST3, Linux ~/.vst3). The zip also has the standalone app, and on Mac the Audio Unit (.component, into /Library/Audio/Plug-Ins/Components). On a Mac, if your DAW refuses it: xattr -cr /Library/Audio/Plug-Ins/VST3/Omega*"
          gh release view omega-solina >/dev/null 2>&1 || gh release create omega-solina --title "Omega Solina (latest)" --notes "$notes" --target "$GITHUB_SHA"
          gh release edit omega-solina --notes "$notes"
          gh release upload omega-solina dl/* --clobber
