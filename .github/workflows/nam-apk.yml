# Builds the NAM A2 Finder Android app and attaches nam-finder.apk to the "nam-latest" release.
# It is a Trusted Web Activity: the /nam/ site full screen in Chrome's engine, so the mic (live guitar),
# file picking, downloads and TONE3000 sign-in work as in the browser. Debug-signed, so it installs
# on your own phone without the private release key.
name: NAM Finder APK
on:
  push:
    branches: [main, 'ccr-*', 'claude/**']
    paths: ['nam/**', 'android/**', '.github/workflows/nam-apk.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '17'}
      - uses: gradle/actions/setup-gradle@v4
        with: {gradle-version: '8.14.3'}
      - name: Build
        run: |
          export ANDROID_HOME="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          echo "sdk.dir=$ANDROID_HOME" > android/local.properties
          gradle -p android assembleNamDebug --no-daemon
          cp android/app/build/outputs/apk/nam/debug/app-nam-debug.apk nam-finder.apk
      - uses: actions/upload-artifact@v4
        with: {name: nam-finder-apk, path: nam-finder.apk, if-no-files-found: error}
      - name: Publish
        env: {GH_TOKEN: '${{ github.token }}'}
        run: |
          gh release view nam-latest >/dev/null 2>&1 || gh release create nam-latest --target "$GITHUB_SHA" --title "NAM A2 Finder (latest)" --notes "Android app for NAM A2 Finder: find, audition and download Neural Amp Modeler A2 rigs. Download nam-finder.apk on your phone and open it to install (allow installs from your browser when Android asks)."
          gh release upload nam-latest nam-finder.apk --clobber
