# Omega XR10 drum machine: the VST3 (AU too on Mac) and standalone app for Windows, Mac and Linux, and the Android APK,
# all attached to the "omega-xr10" release. Runs on main and on working branches so builds can be tried before merging.
name: Omega XR10 release
on:
  push:
    branches: [main, 'claude/**', 'ccr-**']
    paths: ['xr10/**', 'plugins/xr10/**', 'plugins/CMakeLists.txt', 'plugins/tools/hosttest/**', 'android/**', '.github/workflows/xr10-release.yml']
  workflow_dispatch:
permissions:
  contents: write
env:
  VERSION: '1.0.${{ github.run_number }}'
jobs:
  plugins:
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: windows-latest, name: Windows}
          - {os: macos-latest, name: Mac}
          - {os: ubuntu-22.04, name: Linux}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Linux libraries
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev libx11-dev libxinerama-dev libxext-dev libxrandr-dev libxcursor-dev libfreetype6-dev libfontconfig1-dev libgl1-mesa-dev xvfb
      - name: Configure
        run: cmake -S plugins -B build -DCMAKE_BUILD_TYPE=Release -DOMEGA_ONLY=XR10
      - name: Build the sample ROM from xr10/samples
        shell: bash
        run: |
          cmake --build build --config Release --target xr10_make_rom
          t=$(find build -name 'xr10_make_rom' -o -name 'xr10_make_rom.exe' | grep -v '\.dir' | head -1)
          "$t" xr10/samples xr10/rom.bin
      - name: Build
        run: cmake --build build --config Release --parallel 4 --target OmegaXR10_All xr10_test
      - name: Test the engine
        shell: bash
        run: |
          t=$(find build -name 'xr10_test' -o -name 'xr10_test.exe' | grep -v '\.dir' | head -1)
          mkdir -p "$RUNNER_TEMP/xr10" && "$t" "$RUNNER_TEMP/xr10"
      - name: Test the VST3 in a host (Linux)
        if: runner.os == 'Linux'
        run: |
          cmake -S plugins/tools/hosttest -B hbuild -DCMAKE_BUILD_TYPE=Release -DJUCE_DIR="$PWD/build/_deps/juce-src"
          cmake --build hbuild --target xr10_host_test --parallel 4
          xvfb-run -a hbuild/xr10_host_test_artefacts/Release/xr10_host_test "build/OmegaXR10_artefacts/Release/VST3/Omega XR10.vst3" "$RUNNER_TEMP"
      - name: Collect
        shell: bash
        run: |
          mkdir -p out
          find build -path '*Release/VST3/*.vst3' -prune -exec cp -R {} out/ \;
          find build -path '*Release/Standalone/*' -prune \( -name 'Omega XR10' -o -name 'Omega XR10.exe' -o -name 'Omega XR10.app' \) -exec cp -R {} out/ \;
          if [ "$RUNNER_OS" = macOS ]; then
            find build -path '*Release/AU/*.component' -prune -exec cp -R {} out/ \;
            for b in out/*; do codesign --force --deep -s - "$b"; done
          fi
          ls -la out
          cd out && 7z a -tzip "../Omega-XR10-${{ matrix.name }}.zip" . >/dev/null
      - uses: actions/upload-artifact@v4
        with: {name: 'xr10-${{ matrix.name }}', path: 'Omega-XR10-${{ matrix.name }}.zip', if-no-files-found: error}
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '17'}
      - uses: gradle/actions/setup-gradle@v4
        with: {gradle-version: '8.14.3'}
      - name: Engine to WebAssembly
        run: |
          sudo apt-get update && sudo apt-get install -y clang lld
          CLANG=clang sh xr10/tools/build-wasm.sh
          g++ -O2 -std=c++17 xr10/tools/make-rom.cpp -o make-rom && ./make-rom xr10/samples xr10/rom.bin
      - name: Build
        run: |
          export ANDROID_HOME="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          echo "sdk.dir=$ANDROID_HOME" > android/local.properties
          gradle -p android assembleXr10Debug --no-daemon
          cp android/app/build/outputs/apk/xr10/debug/app-xr10-debug.apk omega-xr10.apk
      - uses: actions/upload-artifact@v4
        with: {name: xr10-Android, path: omega-xr10.apk, if-no-files-found: error}
  publish:
    needs: [plugins, apk]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with: {path: dl, merge-multiple: true}
      - name: Release
        env: {GH_TOKEN: '${{ github.token }}', GH_REPO: '${{ github.repository }}'}
        run: |
          ls -la dl
          notes="Omega XR10 $VERSION (from ${GITHUB_REF_NAME}, ${GITHUB_SHA::7}).

          - Android: open omega-xr10.apk on the phone and allow installing from your browser or files app. Works offline; USB / Bluetooth MIDI.
          - Windows: unzip Omega-XR10-Windows.zip, copy Omega XR10.vst3 into C:\\Program Files\\Common Files\\VST3. Omega XR10.exe runs on its own.
          - Mac: unzip Omega-XR10-Mac.zip, copy Omega XR10.vst3 into /Library/Audio/Plug-Ins/VST3 and Omega XR10.component into /Library/Audio/Plug-Ins/Components. If the DAW refuses it: xattr -cr /Library/Audio/Plug-Ins/VST3/Omega*
          - Linux: unzip Omega-XR10-Linux.zip into ~/.vst3."
          gh release view omega-xr10 >/dev/null 2>&1 || gh release create omega-xr10 --title "Omega XR10 (latest)" --notes "$notes" --target "$GITHUB_SHA"
          gh release edit omega-xr10 --notes "$notes"
          gh release upload omega-xr10 dl/* --clobber
