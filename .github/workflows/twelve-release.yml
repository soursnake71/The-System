# Omega Twelve: installers for Windows (setup .exe), macOS (.pkg) and Linux (.deb), and the Android APK,
# all attached to the "omega-twelve" release. Runs on main and on claude/* branches so builds can be tried before merging.
name: Omega Twelve release
on:
  push:
    branches: [main, 'claude/**']
    paths: ['twelve/**', 'plugins/twelve/**', 'plugins/CMakeLists.txt', 'plugins/installer/**', 'android/**', '.github/workflows/twelve-release.yml']
  workflow_dispatch:
permissions:
  contents: write
env:
  VERSION: '1.0.${{ github.run_number }}'
jobs:
  plugins:
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: windows-latest, name: Windows}
          - {os: macos-latest, name: Mac}
          - {os: ubuntu-22.04, name: Linux}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Linux libraries
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev libx11-dev libxinerama-dev libxext-dev libxrandr-dev libxcursor-dev libfreetype6-dev libfontconfig1-dev libgl1-mesa-dev
      - name: Configure
        run: cmake -S plugins -B build -DCMAKE_BUILD_TYPE=Release "-DOMEGA_ONLY=Twelve;TwelveInst"
      - name: Build
        run: cmake --build build --config Release --parallel 4
      - name: Test (C++ engine against the app's engine.js)
        if: runner.os == 'Linux'
        run: node twelve/tools/compare.mjs build/twelve_test "$RUNNER_TEMP"
      - name: Collect
        shell: bash
        run: |
          mkdir -p out
          find build -path '*Release/VST3/*.vst3' -prune -exec cp -R {} out/ \;
          find build -path '*Release/Standalone/*' -prune \( -name 'Omega Twelve' -o -name 'Omega Twelve.exe' -o -name 'Omega Twelve.app' \) -exec cp -R {} out/ \;
          if [ "$RUNNER_OS" = macOS ]; then find build -path '*Release/AU/*.component' -prune -exec cp -R {} out/ \; ; fi
          ls -la out
      - name: Windows installer
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" "/DBuildDir=$PWD\out" "/DAppVer=$env:VERSION" /O"$PWD" plugins\installer\twelve.iss
          Get-ChildItem Omega-Twelve-Setup-Windows.exe
      - name: Mac installer
        if: runner.os == 'macOS'
        run: bash plugins/installer/make-pkg-mac.sh out "$VERSION" Omega-Twelve-Mac.pkg
      - name: Linux package
        if: runner.os == 'Linux'
        run: |
          bash plugins/installer/make-deb.sh out "$VERSION" twelve/icon-512.png omega-twelve_amd64.deb
          sudo dpkg -i omega-twelve_amd64.deb && ls /usr/lib/vst3
      - uses: actions/upload-artifact@v4
        with:
          name: twelve-${{ matrix.name }}
          path: |
            Omega-Twelve-Setup-Windows.exe
            Omega-Twelve-Mac.pkg
            omega-twelve_amd64.deb
          if-no-files-found: error
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '17'}
      - uses: gradle/actions/setup-gradle@v4
        with: {gradle-version: '8.14.3'}
      - name: Build
        run: |
          export ANDROID_HOME="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          echo "sdk.dir=$ANDROID_HOME" > android/local.properties
          gradle -p android assembleTwelveDebug --no-daemon
          cp android/app/build/outputs/apk/twelve/debug/app-twelve-debug.apk omega-twelve.apk
      - uses: actions/upload-artifact@v4
        with: {name: twelve-Android, path: omega-twelve.apk, if-no-files-found: error}
  publish:
    needs: [plugins, apk]
    # publish whatever built: a Mac runner that never starts shouldn't hold back the Windows, Linux and Android files
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with: {path: dl, merge-multiple: true}
      - name: Release
        env: {GH_TOKEN: '${{ github.token }}', GH_REPO: '${{ github.repository }}'}
        run: |
          ls -la dl
          notes="Omega Twelve $VERSION (from ${GITHUB_REF_NAME}, ${GITHUB_SHA::7}).

          - Windows: Omega-Twelve-Setup-Windows.exe installs the VST3 effect and instrument into C:\\Program Files\\Common Files\\VST3 and the standalone app. Windows may warn about an unknown publisher: More info > Run anyway.
          - Mac: Omega-Twelve-Mac.pkg installs VST3, Audio Unit and the app. It isn't notarized: right-click the .pkg > Open, or allow it in System Settings > Privacy & Security.
          - Linux: sudo apt install ./omega-twelve_amd64.deb (VST3 in /usr/lib/vst3, app in the menu).
          - Android: open omega-twelve.apk on the phone and allow installing from your browser or files app. Works offline; USB MIDI and an external / wireless display for the TV screen."
          gh release view omega-twelve >/dev/null 2>&1 || gh release create omega-twelve --title "Omega Twelve (latest)" --notes "$notes" --target "$GITHUB_SHA"
          gh release edit omega-twelve --notes "$notes"
          gh release upload omega-twelve dl/* --clobber
