# Omega DMX: installers for Windows (setup .exe), macOS (.pkg) and Linux (.deb), and the Android APK,
# all attached to the "omega-dmx" release. Runs on main and on claude/* branches so builds can be tried before merging.
name: Omega DMX release
on:
  push:
    branches: [main, 'claude/**']
    paths: ['dmx/**', 'plugins/dmx/**', 'plugins/CMakeLists.txt', 'plugins/installer/*dmx*', 'android/**', '.github/workflows/dmx-release.yml']
  workflow_dispatch:
permissions:
  contents: write
env:
  VERSION: '1.0.${{ github.run_number }}'
jobs:
  plugins:
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: windows-latest, name: Windows}
          - {os: macos-latest, name: Mac}
          - {os: ubuntu-22.04, name: Linux}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Linux libraries
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev libx11-dev libxinerama-dev libxext-dev libxrandr-dev libxcursor-dev libfreetype6-dev libfontconfig1-dev libgl1-mesa-dev
      - name: Configure
        run: cmake -S plugins -B build -DCMAKE_BUILD_TYPE=Release "-DOMEGA_ONLY=DMX"
      - name: Build
        run: cmake --build build --config Release --parallel 4
      - name: Test (kit table up to date with dmx/kits.js, and the engine)
        if: runner.os == 'Linux'
        run: |
          node dmx/tools/gen.mjs && git diff --exit-code plugins/dmx/Kits.inc
          cmake --build build --target dmx_test dmx_circuit_dump && build/dmx_test dmx/kits
          node dmx/tools/compare.mjs build/dmx_circuit_dump "$RUNNER_TEMP/dmx-circuit"
      - name: Collect
        shell: bash
        run: |
          mkdir -p out
          find build -path '*Release/VST3/*.vst3' -prune -exec cp -R {} out/ \;
          find build -path '*Release/Standalone/*' -prune \( -name 'Omega DMX' -o -name 'Omega DMX.exe' -o -name 'Omega DMX.app' \) -exec cp -R {} out/ \;
          if [ "$RUNNER_OS" = macOS ]; then find build -path '*Release/AU/*.component' -prune -exec cp -R {} out/ \; ; fi
          ls -la out
      - name: Windows installer
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" "/DBuildDir=$PWD\out" "/DAppVer=$env:VERSION" /O"$PWD" plugins\installer\dmx.iss
          Get-ChildItem Omega-DMX-Setup-Windows.exe
      - name: Mac installer
        if: runner.os == 'macOS'
        run: bash plugins/installer/make-pkg-mac-dmx.sh out "$VERSION" Omega-DMX-Mac.pkg
      - name: Linux package
        if: runner.os == 'Linux'
        run: |
          bash plugins/installer/make-deb-dmx.sh out "$VERSION" dmx/icon-512.png omega-dmx_amd64.deb
          sudo dpkg -i omega-dmx_amd64.deb && ls /usr/lib/vst3
      - uses: actions/upload-artifact@v4
        with:
          name: dmx-${{ matrix.name }}
          path: |
            Omega-DMX-Setup-Windows.exe
            Omega-DMX-Mac.pkg
            omega-dmx_amd64.deb
          if-no-files-found: error
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '17'}
      - uses: gradle/actions/setup-gradle@v4
        with: {gradle-version: '8.14.3'}
      - name: Build
        run: |
          export ANDROID_HOME="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          echo "sdk.dir=$ANDROID_HOME" > android/local.properties
          gradle -p android assembleDmxDebug --no-daemon
          cp android/app/build/outputs/apk/dmx/debug/app-dmx-debug.apk omega-dmx.apk
      - uses: actions/upload-artifact@v4
        with: {name: dmx-Android, path: omega-dmx.apk, if-no-files-found: error}
  publish:
    needs: [plugins, apk]
    # publish whatever built: a Mac runner that never starts shouldn't hold back the Windows, Linux and Android files
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with: {path: dl, merge-multiple: true}
      - name: Release
        env: {GH_TOKEN: '${{ github.token }}', GH_REPO: '${{ github.repository }}'}
        run: |
          ls -la dl
          notes="Omega DMX $VERSION (from ${GITHUB_REF_NAME}, ${GITHUB_SHA::7}).

          - Windows: Omega-DMX-Setup-Windows.exe installs the VST3 instrument into C:\\Program Files\\Common Files\\VST3 and the standalone app. Windows may warn about an unknown publisher: More info > Run anyway.
          - Mac: Omega-DMX-Mac.pkg installs VST3, Audio Unit and the app. It isn't notarized: right-click the .pkg > Open, or allow it in System Settings > Privacy & Security.
          - Linux: sudo apt install ./omega-dmx_amd64.deb (VST3 in /usr/lib/vst3, app in the menu).
          - Android: open omega-dmx.apk on the phone and allow installing from your browser or files app. Works offline; USB and Bluetooth MIDI."
          gh release view omega-dmx >/dev/null 2>&1 || gh release create omega-dmx --title "Omega DMX (latest)" --notes "$notes" --target "$GITHUB_SHA"
          gh release edit omega-dmx --notes "$notes"
          gh release upload omega-dmx dl/* --clobber
