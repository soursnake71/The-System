# Omega Five (12-bit drum machine): installers for Windows (setup .exe), macOS (.pkg) and Linux (.deb), and the
# Android APK, all attached to the "omega-five" release. Runs on main and on claude/* and ccr-* branches so builds
# can be tried before merging.
name: Omega Five release
on:
  push:
    branches: [main, 'claude/**', 'ccr-**']
    paths: ['five/**', 'plugins/five/**', 'plugins/CMakeLists.txt', 'plugins/installer/**', 'android/**', '.github/workflows/five-release.yml']
  workflow_dispatch:
permissions:
  contents: write
env:
  VERSION: '1.0.${{ github.run_number }}'
jobs:
  plugins:
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: windows-latest, name: Windows}
          - {os: macos-latest, name: Mac}
          - {os: ubuntu-22.04, name: Linux}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Linux libraries
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev libx11-dev libxinerama-dev libxext-dev libxrandr-dev libxcursor-dev libfreetype6-dev libfontconfig1-dev libgl1-mesa-dev xvfb
      - name: Configure
        run: cmake -S plugins -B build -DCMAKE_BUILD_TYPE=Release "-DOMEGA_ONLY=Five"
      - name: Build
        run: cmake --build build --config Release --parallel 4
      - name: Test (engine and sequencer in node)
        if: runner.os == 'Linux'
        run: node five/tools/test.mjs
      - name: Test (C++ engine against the app's engine.js)
        if: runner.os == 'Linux'
        run: node five/tools/compare.mjs build/five_test "$RUNNER_TEMP"
      - name: Test (C++ sequencer, SysEx, cartridge and RX5 bank against seq.js / rxsysex.js / rxcart.js)
        if: runner.os == 'Linux'
        run: node five/tools/interop.mjs build/five_seq_test_artefacts/Release/five_seq_test "$RUNNER_TEMP/interop"
      - name: Test (the plugin's processor and panel)
        if: runner.os == 'Linux'
        run: |
          cmake --build build --config Release --target five_proc_test --parallel 4
          xvfb-run -a build/five_proc_test_artefacts/Release/five_proc_test "$RUNNER_TEMP/proc"
      - name: Collect
        shell: bash
        run: |
          mkdir -p out
          find build -path '*Release/VST3/*.vst3' -prune -name 'Omega Five.vst3' -exec cp -R {} out/ \;
          find build -path '*Release/Standalone/*' -prune \( -name 'Omega Five' -o -name 'Omega Five.exe' -o -name 'Omega Five.app' \) -exec cp -R {} out/ \;
          if [ "$RUNNER_OS" = macOS ]; then find build -path '*Release/AU/*.component' -prune -name 'Omega Five.component' -exec cp -R {} out/ \; ; fi
          ls -la out
      - name: Windows installer
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" "/DBuildDir=$PWD\out" "/DAppVer=$env:VERSION" /O"$PWD" plugins\installer\five.iss
          Get-ChildItem Omega-Five-Setup-Windows.exe
      - name: Mac installer
        if: runner.os == 'macOS'
        run: bash plugins/installer/make-pkg-mac.sh out "$VERSION" Omega-Five-Mac.pkg "Omega Five"
      - name: Linux package
        if: runner.os == 'Linux'
        run: |
          bash plugins/installer/make-deb.sh out "$VERSION" five/icon-512.png omega-five_amd64.deb "Omega Five" \
            "12-bit digital rhythm programmer (drum machine)" \
            "VST3 plugin plus a standalone app: an RX5-style 12-bit drum machine playing recordings of a real RX5 through a modelled 12-bit playback path, REV7-style reverb, 2290-style delay, patterns, songs, MIDI files and SysEx."
          sudo dpkg -i omega-five_amd64.deb && ls /usr/lib/vst3
      - uses: actions/upload-artifact@v4
        with:
          name: five-${{ matrix.name }}
          path: |
            Omega-Five-Setup-Windows.exe
            Omega-Five-Mac.pkg
            omega-five_amd64.deb
          if-no-files-found: error
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '17'}
      - uses: gradle/actions/setup-gradle@v4
        with: {gradle-version: '8.14.3'}
      - name: Build
        run: |
          export ANDROID_HOME="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          echo "sdk.dir=$ANDROID_HOME" > android/local.properties
          gradle -p android assembleFiveDebug --no-daemon
          cp android/app/build/outputs/apk/five/debug/app-five-debug.apk omega-five.apk
      - uses: actions/upload-artifact@v4
        with: {name: five-Android, path: omega-five.apk, if-no-files-found: error}
  publish:
    needs: [plugins, apk]
    # publish whatever built: a Mac runner that never starts shouldn't hold back the Windows, Linux and Android files
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with: {path: dl, merge-multiple: true}
      - name: Release
        env: {GH_TOKEN: '${{ github.token }}', GH_REPO: '${{ github.repository }}'}
        run: |
          ls -la dl
          notes="Omega Five $VERSION (from ${GITHUB_REF_NAME}, ${GITHUB_SHA::7}).

          - Windows: Omega-Five-Setup-Windows.exe installs the VST3 plugin into C:\\Program Files\\Common Files\\VST3 and the standalone app. Windows may warn about an unknown publisher: More info > Run anyway.
          - Mac: Omega-Five-Mac.pkg installs VST3, Audio Unit and the app. It isn't notarized: right-click the .pkg > Open, or allow it in System Settings > Privacy & Security.
          - Linux: sudo apt install ./omega-five_amd64.deb (VST3 in /usr/lib/vst3, app in the menu).
          - Android: open omega-five.apk on the phone and allow installing from your browser or files app. Works offline, full screen in landscape; USB / Bluetooth MIDI in and out."
          gh release view omega-five >/dev/null 2>&1 || gh release create omega-five --title "Omega Five (latest)" --notes "$notes" --target "$GITHUB_SHA"
          gh release edit omega-five --notes "$notes"
          gh release upload omega-five dl/* --clobber
