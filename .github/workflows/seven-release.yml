# Omega Seven (6-operator FM synthesizer): VST3 + standalone app for Windows, macOS (plus AU) and Linux, and the
# Android APK, all attached to the "omega-seven" release. Runs on main and on claude/* branches so builds can be tried
# before merging. The C++ engine is checked against the web app's engine (bit for bit) before anything is published.
name: Omega Seven release
on:
  push:
    branches: [main, 'claude/**']
    paths: ['seven/**', 'plugins/seven/**', 'plugins/CMakeLists.txt', 'plugins/tools/hosttest/**', 'android/**', '.github/workflows/seven-release.yml']
  workflow_dispatch:
permissions:
  contents: write
env:
  VERSION: '1.0.${{ github.run_number }}'
jobs:
  plugins:
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: windows-latest, name: Windows}
          - {os: macos-latest, name: Mac}
          - {os: ubuntu-22.04, name: Linux}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Linux libraries
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev libx11-dev libxinerama-dev libxext-dev libxrandr-dev libxcursor-dev libfreetype6-dev libfontconfig1-dev libgl1-mesa-dev xvfb
      - name: Configure
        run: cmake -S plugins -B build -DCMAKE_BUILD_TYPE=Release -DOMEGA_ONLY=Seven
      - name: Build
        run: cmake --build build --config Release --parallel 4 --target OmegaSeven_All seven_test
      - name: Test (C++ engine against the app's engine.js, sample for sample)
        if: runner.os == 'Linux'
        run: node seven/tools/compare.mjs build/seven_test "$RUNNER_TEMP"
      - name: 'Test (the processor - sysex, panel, arpeggiator, sequencer, MIDI files, state)'
        if: runner.os == 'Linux'
        run: |
          cmake --build build --config Release --parallel 4 --target seven_proc_test
          xvfb-run -a "$(find build -name seven_proc_test -type f -perm -u+x | head -1)" "$RUNNER_TEMP"
      - name: Collect
        shell: bash
        run: |
          mkdir -p out
          find build -path '*Release/VST3/*.vst3' -prune -name 'Omega Seven.vst3' -exec cp -R {} out/ \;
          find build -path '*Release/Standalone/*' -prune \( -name 'Omega Seven' -o -name 'Omega Seven.exe' -o -name 'Omega Seven.app' \) -exec cp -R {} out/ \;
          if [ "$RUNNER_OS" = macOS ]; then
            find build -path '*Release/AU/*.component' -prune -name 'Omega Seven.component' -exec cp -R {} out/ \;
            for b in out/*; do codesign --force --deep -s - "$b"; done
          fi
          ls -la out
          cd out && 7z a -tzip "../Omega-Seven-${{ matrix.name }}.zip" . >/dev/null
      - uses: actions/upload-artifact@v4
        with: {name: 'seven-${{ matrix.name }}', path: 'Omega-Seven-${{ matrix.name }}.zip', if-no-files-found: error}
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '17'}
      - uses: gradle/actions/setup-gradle@v4
        with: {gradle-version: '8.14.3'}
      - name: Build
        run: |
          export ANDROID_HOME="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          echo "sdk.dir=$ANDROID_HOME" > android/local.properties
          gradle -p android assembleSevenDebug --no-daemon
          cp android/app/build/outputs/apk/seven/debug/app-seven-debug.apk omega-seven.apk
      - uses: actions/upload-artifact@v4
        with: {name: seven-Android, path: omega-seven.apk, if-no-files-found: error}
  publish:
    needs: [plugins, apk]
    # publish whatever built: a Mac runner that never starts shouldn't hold back the others
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with: {path: dl, merge-multiple: true}
      - name: Release
        env: {GH_TOKEN: '${{ github.token }}', GH_REPO: '${{ github.repository }}'}
        run: |
          ls -la dl
          notes="Omega Seven $VERSION (from ${GITHUB_REF_NAME}, ${GITHUB_SHA::7}): 6-operator FM synthesizer, Mark I 12-bit converter, sysex banks, arpeggiator, function sequencer, full MIDI.

          - Android: open omega-seven.apk on the phone and allow installing from your browser or files app. Works offline; USB and Bluetooth MIDI (sysex too). Saved banks and MIDI files go to Download/Omega Seven.
          - Windows: unzip Omega-Seven-Windows.zip, copy Omega Seven.vst3 into C:\\Program Files\\Common Files\\VST3. Omega Seven.exe runs on its own.
          - Mac: unzip Omega-Seven-Mac.zip, copy Omega Seven.vst3 into /Library/Audio/Plug-Ins/VST3 and Omega Seven.component into /Library/Audio/Plug-Ins/Components. If refused: xattr -cr /Library/Audio/Plug-Ins/VST3/Omega*
          - Linux: unzip Omega-Seven-Linux.zip, copy Omega Seven.vst3 into ~/.vst3.
          VST3 hosts don't pass sysex to plugins: load .syx banks with MEMORY (or FUNCTION 11) in the plugin; the standalone app, the AU and the Android app take sysex over MIDI too."
          gh release view omega-seven >/dev/null 2>&1 || gh release create omega-seven --title "Omega Seven (latest)" --notes "$notes" --target "$GITHUB_SHA"
          gh release edit omega-seven --notes "$notes"
          gh release upload omega-seven dl/* --clobber
