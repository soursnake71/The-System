# XcodeGen spec: `xcodegen generate` makes OmegaSystem.xcodeproj (two apps: The Omega System and Omega Vox)
name: OmegaSystem
options:
  bundleIdPrefix: com.thesnakedevice
  deploymentTarget: {iOS: "15.0"}
settings:
  base:
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.0"
    TARGETED_DEVICE_FAMILY: "1,2"
    CODE_SIGNING_ALLOWED: "NO"
targetTemplates:
  WebApp:
    type: application
    platform: iOS

targets:
  Omega:
    templates: [WebApp]
    sources: [Shared, Omega/Assets.xcassets]
    info:
      path: Omega/Info.plist
      properties:
        CFBundleDisplayName: "Omega System"
        START_URL: "https://soursnake71.github.io/The-System/"
        UILaunchScreen: {UIColorName: ""}
        UIStatusBarStyle: UIStatusBarStyleLightContent
        UIBackgroundModes: [audio]
        NSMicrophoneUsageDescription: "The microphone records audio tracks, samples onto pads and feeds the vocoder."
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        UISupportedInterfaceOrientations~ipad: [UIInterfaceOrientationPortrait, UIInterfaceOrientationPortraitUpsideDown, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        UIRequiresFullScreen: true
        ITSAppUsesNonExemptEncryption: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.thesnakedevice.omega
        PRODUCT_NAME: OmegaSystem
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
  Vox:
    templates: [WebApp]
    sources: [Shared, Vox/Assets.xcassets]
    info:
      path: Vox/Info.plist
      properties:
        CFBundleDisplayName: "Omega Vox"
        START_URL: "https://soursnake71.github.io/The-System/?app=vox"
        UILaunchScreen: {UIColorName: ""}
        UIStatusBarStyle: UIStatusBarStyleLightContent
        UIBackgroundModes: [audio]
        NSMicrophoneUsageDescription: "The microphone feeds the vocoder and records your voice."
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        UISupportedInterfaceOrientations~ipad: [UIInterfaceOrientationPortrait, UIInterfaceOrientationPortraitUpsideDown, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        UIRequiresFullScreen: true
        ITSAppUsesNonExemptEncryption: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.thesnakedevice.vox
        PRODUCT_NAME: OmegaVox
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
