<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>RX5</title>
<meta name="description" content="RX5: a 12-bit PCM digital rhythm programmer. 24 voices recorded from a real RX5 through a modelled 12-bit playback path, REV7-style reverb, TC-style delay, real-time and step write, songs, chains, MIDI and cartridges.">
<meta name="theme-color" content="#1c1c1c">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
:root{
  --body:#2e2e2c; --face:#575754; --face2:#3c3c3a; --print:#e9e9e6; --dim:#9a9a96;
  --lcd:#d6e41e; --lcd2:#c4d212; --lcdInk:#6f8200; --lcdOff:#c5cf18;
  --key:#b4a8a5; --keyLit:#ed6a7c; --green:#98e0aa; --green2:#78c48e; --cream:#f7e0b3; --cream2:#e4c898;
  --red:#f68a66; --red2:#e06a44; --blue:#a29dd4; --blue2:#8580bd;
  --cond:"Arial Narrow", "Roboto Condensed", "sans-serif-condensed", "Helvetica Neue", Helvetica, Arial, sans-serif;
  --mono:"Courier New", ui-monospace, Menlo, Consolas, monospace;
}
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent}
html,body{margin:0; height:100%; overflow:hidden; overscroll-behavior:none; background:#0c0c0c; touch-action:none;
  -webkit-user-select:none; user-select:none; -webkit-touch-callout:none; font-family:var(--cond)}
button{font:inherit; color:inherit; padding:0; margin:0; border:0; background:none; cursor:pointer}
/* the panel is laid out at the size of the photo (1300 x 973) and scaled to fit: nothing ever scrolls */
#stage{position:fixed; inset:0; overflow:hidden}
#p{position:absolute; left:0; top:0; width:1300px; height:973px; transform-origin:0 0; overflow:hidden; border-radius:10px; background:var(--body)}
#p > *, #p > div > *{position:absolute}
#p .lcd .row{position:relative}
.slider .cap, .pad b, .pad .fl, .acc small, .lcd .row i::after{position:absolute}

/* ---- top: angled black ribs ---- */
.ribs{left:0; top:0; width:1300px; height:312px; background:linear-gradient(180deg, #d9d9d2 0 3px, #4a4a4a 3px 6px, #141414 9px)}
.rib{top:8px; height:290px; border-radius:2px 2px 5px 5px; background:linear-gradient(90deg, #1e1e1e, #555 14%, #4d4d4d 70%, #3d3d3d 88%, #1a1a1a);
  box-shadow:0 3px 3px #000a}
.rib.cut{height:157px; border-radius:2px 2px 0 0}
.rib.lo{top:165px; height:133px; border-radius:0 0 4px 4px;
  background:repeating-linear-gradient(180deg, #0000 0 5px, #1a1a1a 5px 7px) 3px 8px / 9px 100% no-repeat, repeating-linear-gradient(180deg, #0000 0 5px, #1a1a1a 5px 7px) right 3px top 8px / 9px 100% no-repeat, linear-gradient(90deg, #1e1e1e, #525252 14%, #4a4a4a 70%, #3a3a3a 88%, #1a1a1a)}
.slider{width:30px; touch-action:none; cursor:ns-resize}
.slider .cap{left:7px; width:16px; height:34px; margin-top:-17px; border-radius:2px;
  background:repeating-linear-gradient(180deg, #333 0 2px, #0a0a0a 2px 4px), #111;
  box-shadow:0 0 0 1px #000, 0 5px 5px #000c}
.slider .cap::before{content:""; position:absolute; left:1px; right:1px; top:16px; height:4px; border-radius:1px; background:linear-gradient(180deg, #f2eee2, #b9b5aa)}
/* the lip between the ribs and the front panel */
.lip{left:0; top:300px; width:1300px; height:46px; background:linear-gradient(180deg, #6a6a67, #5f5f5c 30%, #5a5a57); border-radius:10px 10px 0 0; box-shadow:0 -2px 6px #000a}
.front{left:0; top:340px; width:1300px; height:633px; background:linear-gradient(180deg, var(--face), #474744 35%, var(--face2) 75%, #353533)}
.sl{font:700 8px/1 Arial, Helvetica, sans-serif; color:var(--print); white-space:nowrap; text-align:center; transform:translateX(-50%); letter-spacing:.1px}

/* ---- the display window ---- */
.win{left:95px; top:392px; width:1124px; height:142px; border-radius:5px; background:linear-gradient(180deg, #232220, #1a1918 60%, #201f1d); box-shadow:0 0 0 1px #000, 0 1px 0 #ffffff14, inset 0 1px 0 #ffffff10}
.mk{height:18px; width:31px; margin-left:-15.5px; top:412px; border-radius:2px; background:linear-gradient(180deg, #dcdcd8, var(--key) 60%, #a9a9a6); color:#222;
  font:700 7.5px/1 Arial, sans-serif; display:flex; align-items:center; justify-content:center; text-align:center; letter-spacing:-.1px; box-shadow:0 1px 0 #000, inset 0 -1px 0 #0003; white-space:pre-line}
.mk.on{background:linear-gradient(180deg, #ff8a92, var(--keyLit) 60%, #d23d4a); box-shadow:0 0 10px #ff304a99, 0 1px 0 #000}
.mk.ind{cursor:default}
.mk:active{transform:translateY(1px)}
.lcd{left:576px; top:400px; width:180px; height:46px; border-radius:2px; background:radial-gradient(120% 140% at 50% 40%, var(--lcd), var(--lcd2)); box-shadow:0 0 0 2px #2a3300, 0 0 14px #b8e02a55, inset 0 0 6px #6d8a0060;
  padding:4px 3px 0 4px; cursor:pointer}
.lcd .row{position:relative; display:flex; height:19px; margin-bottom:1px}
.lcd .row i{position:relative; display:block; width:10.8px; height:19px; margin-right:.25px; font:400 17.5px/19px var(--mono); color:var(--lcdInk); text-align:center; font-style:normal; background:#a8bd0c14;
  text-shadow:0 0 .4px var(--lcdInk), .3px 0 0 var(--lcdInk)}
.lcd .row i.cur{animation:blink 1s steps(1) infinite}
@keyframes blink{50%{background:var(--lcdInk); color:var(--lcd)}}
/* dot matrix: a 5 x 8 dot screen over each character cell */
.lcd .row i::after{content:""; position:absolute; inset:0; background:
  repeating-linear-gradient(90deg, #0000 0 1.75px, var(--lcd) 1.75px 2.16px),
  repeating-linear-gradient(180deg, #0000 0 2px, var(--lcd) 2px 2.375px); opacity:.55; pointer-events:none}
.lcdhit{top:400px; width:90px; height:46px; cursor:pointer}
.legend{color:var(--print); font:400 7px/1.1 var(--cond); white-space:nowrap}
.legend b{display:block; font-weight:700; font-size:7.6px; line-height:1; letter-spacing:.1px}
.legend .h{border-bottom:1px solid #d8d8d8; padding-bottom:1px; margin-bottom:1px}
.legend u{display:block; text-decoration:none; cursor:pointer; border-radius:1px; padding:0 1px}
.legend u:hover, .legend u.on{background:#ffffff2e}
.legend em{font-style:normal; display:block; padding-left:6px}
/* ---- the rail (page keys), the pages and the loupe: hardware keys on a dark plate ---- */
#rail{position:fixed; z-index:15; display:grid; gap:5px; padding:6px; box-sizing:border-box; background:linear-gradient(90deg, #3a2614, #5a3a1e 30%, #4a2f17 70%, #2e1d0e);
  box-shadow:inset 0 0 0 1px #000, inset 0 0 12px #0008}
body.land #rail{grid-auto-rows:1fr; grid-template-columns:1fr; align-content:stretch; gap:4px; padding:5px 5px}
body.land #rail .rk{min-height:20px}
body.land #rail .fold{grid-column:1 / -1}
body.port #rail{grid-template-columns:repeat(6, 1fr); grid-template-rows:1fr 1fr; background:linear-gradient(180deg, #2c2b29, #1d1c1a); border-radius:6px}
#rail.mini{display:block; background:none; box-shadow:none; padding:0}
#rail.mini > *:not(.fold){display:none}
#rail.mini .fold{width:100%; height:100%}
.rk{border-radius:3px; background:linear-gradient(180deg, #4a4a47, #2c2c2a 55%, #1c1c1b); color:#ececec; font:700 10px/1.05 var(--cond); letter-spacing:.2px; overflow:hidden; white-space:nowrap;
  box-shadow:0 0 0 1.5px #9a9a97, 0 0 0 2.5px #0a0a0a, 0 3px 3px #000a, inset 0 1px 0 #444; min-height:28px; padding:2px}
.rk:active{transform:translateY(1px)}
.rk.on{background:linear-gradient(180deg, #ff8a92, #ed6a7c 60%, #d23d4a); color:#1a0a0c; box-shadow:0 0 10px #ff304a99, 0 0 0 1.5px #9a9a97, 0 0 0 2.5px #0a0a0a}
.rk.fold{background:linear-gradient(180deg, #dcdcd8, #b4a8a5 60%, #a9a9a6); color:#222}
.rk.zoom.on{background:linear-gradient(180deg, #a0a3ef, #a29dd4 45%, #8580bd); color:#fff}
#pageView{position:fixed; z-index:10; display:none; flex-direction:column; overflow:hidden; box-sizing:border-box; padding:8px 10px; border-radius:6px; color:#e9e9e6;
  background:repeating-linear-gradient(90deg, #ffffff05 0 1px, #0000 1px 3px), linear-gradient(180deg, #575754, #474744 40%, #3c3c3a); box-shadow:inset 0 0 0 1px #000, inset 0 1px 0 #ffffff22}
#pageView::before, #pageView::after{content:""; position:absolute; top:6px; width:8px; height:8px; border-radius:50%; background:radial-gradient(circle at 35% 35%, #ddd, #666 60%, #222)}
#pageView::before{left:6px}#pageView::after{right:6px}
.pgTop{display:flex; align-items:center; gap:8px; flex-wrap:wrap; padding:0 12px 6px; border-bottom:1px solid #d8d8d855; margin-bottom:6px}
.pgTitle{font:700 15px/1 Arial, sans-serif; letter-spacing:.8px}
.pgCtx{display:flex; align-items:center; gap:4px; font:700 12px Arial, sans-serif}.pgCtx i{font-style:normal; opacity:.75}.pgCtx b{min-width:62px; text-align:center; font-family:var(--mono); color:#d6e41e}
.pgBtns{display:flex; gap:4px; margin-left:auto}
.pgTop{flex:none}
.pgBodyWrap > *{flex:none}
.pgBodyWrap{position:relative; flex:1 1 0; min-height:0; overflow:hidden; display:flex; flex-direction:column; gap:4px}
.pgHead{font:700 12px/1.2 Arial, sans-serif; letter-spacing:.6px; color:#fff; border-bottom:1px solid #d8d8d8aa; padding:4px 2px 2px; margin-top:2px}
.pgHead.small{font-size:11px; color:#f7e0b3}
.pgRow{display:grid; grid-template-columns:minmax(110px, 1.1fr) minmax(90px, 1fr) auto; align-items:center; gap:6px; min-height:38px; padding:2px 6px;
  border-radius:3px; background:#00000026; box-shadow:inset 0 1px 0 #0006, inset 0 -1px 0 #ffffff14}
.pgName{font:700 12px/1.15 Arial, sans-serif}.pgName i{font-style:normal; opacity:.7; font-family:var(--mono)}
.pgVal{font:400 15px/1.1 var(--mono); color:#d6e41e; background:#1b1d10; border-radius:2px; padding:4px 6px; box-shadow:inset 0 0 0 1px #000; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.pgCtl{display:flex; align-items:center; gap:5px}
.pgSl{width:90px; accent-color:#d6e41e}
@media (max-width:480px){ .pgRow{grid-template-columns:minmax(78px, .9fr) minmax(70px, 1fr) auto; gap:4px; padding:2px 4px} .pgSl{width:70px} .pgName{font-size:11px} .pgVal{font-size:13px; padding:4px} .pk{min-width:34px} }
.pk{min-width:38px; height:34px; border-radius:3px; background:linear-gradient(180deg, #fbe9cf, #f7e0b3 50%, #e4c898); color:#5a4a36; font:700 14px Arial, sans-serif;
  box-shadow:0 0 0 1px #8b7457, 0 3px 3px #000a, inset 0 1px 0 #fff6; padding:0 6px}
.pk:active{transform:translateY(1px); filter:brightness(.92)}
.pk.red{background:linear-gradient(180deg, #f6826a, #f68a66 50%, #e06a44); color:#5a1a0d}
.pk.blue{background:linear-gradient(180deg, #a0a3ef, #a29dd4 45%, #8580bd); color:#fff}
.pk.start{background:linear-gradient(180deg, #f88b6e, #f68a66 45%, #e06a44); color:#fff}
.pk.pg{min-width:32px; height:30px; font-size:12px}.pk.pg.on{background:linear-gradient(180deg, #ff8a92, #ed6a7c 60%, #d23d4a); color:#1a0a0c}
.bigLcd{white-space:pre; font:400 clamp(18px, 7.2vw, 34px)/1.15 var(--mono); color:#6f8200; background:radial-gradient(120% 140% at 50% 40%, #d6e41e, #c4d212); border-radius:3px;
  padding:6px 8px; box-shadow:0 0 0 2px #2a3300, 0 0 14px #b8e02a55; text-align:left; overflow:hidden}
.bigKeys{display:grid; grid-template-columns:1fr 1fr; gap:8px; margin-top:8px; flex:1}
.bigKeys .pk{height:auto; min-height:44px; font-size:15px}
#loupe{position:fixed; z-index:30; display:none; overflow:hidden; border-radius:12px; background:#2e2e2c; box-shadow:0 0 0 2px #e9e9e6, 0 0 0 4px #000, 0 16px 40px #000d; touch-action:none}
#loupeIn{position:absolute; inset:0}
#loupeIn .pclone{position:absolute; left:0; top:0; transform-origin:0 0; width:1300px; height:973px; overflow:hidden; border-radius:10px; background:var(--body)}
#loupeIn .pclone > *, #loupeIn .pclone > div > *{position:absolute}
#loupeIn .pclone .lcd .row{position:relative}
#loupeIn .pclone .slider .cap, #loupeIn .pclone .pad b, #loupeIn .pclone .pad .fl, #loupeIn .pclone .acc small, #loupeIn .pclone .lcd .row i::after{position:absolute}
/* the magnified legend column */
#mag{display:none; z-index:20; padding:10px 16px 12px; border-radius:8px; background:linear-gradient(180deg, #2a2927, #1c1b19); box-shadow:0 0 0 1px #000, 0 0 0 2px #77776f, 0 14px 40px #000d}
#mag .legend{position:relative; left:auto; top:auto; cursor:default}
#mag .legend u{padding:1px 2px}
#mag .legend u.on{background:#ffffff3a}
.legend{cursor:zoom-in}
.logo{left:1040px; top:462px; width:180px; color:#f4f4f2}
.logo .om{left:0; top:0; font:700 21px/1 Helvetica, Arial, sans-serif; letter-spacing:1.5px; transform:scaleY(.95)}
.logo .drp{left:0; top:4px; font:400 6.9px/1 Arial, sans-serif; letter-spacing:.35px}
.logo svg{left:-2px; top:14px}
.dice{left:1160px; top:498px; width:36px; height:28px; display:flex; flex-direction:column; align-items:center; gap:1px}
.dice span{position:static; font:700 6px/1 Arial, sans-serif; color:var(--print); letter-spacing:.2px}
.dice svg{position:static; width:20px; height:20px; border-radius:3px; background:linear-gradient(180deg, #dcdcd8, var(--key)); box-shadow:0 1px 0 #000}
.dice.on svg{background:linear-gradient(180deg, #ff8a92, var(--keyLit))}
.dice:active svg{transform:translateY(1px)}

/* ---- keys ---- */
.fk{width:80px; height:21px; margin:-10.5px 0 0 -40px; border-radius:2px; background:linear-gradient(180deg, #4a4a47, #2c2c2a 55%, #1c1c1b); color:#ececec;
  box-shadow:0 0 0 1.5px #9a9a97, 0 0 0 2.5px #0a0a0a, 0 3px 3px #000a, inset 0 1px 0 #444; font:700 6.6px/1.02 Arial, sans-serif; display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center; letter-spacing:-.05px}
.fk span{position:static; display:block}
.fk:active, .fk.dn{transform:translateY(1px); box-shadow:0 0 0 1.5px #777, 0 0 0 2.5px #0a0a0a, 0 1px 1px #000a, inset 0 1px 0 #444}
.fk.sel{box-shadow:0 0 0 1.5px #b8b8b8, 0 0 0 2.5px #0a0a0a, 0 3px 3px #000a, inset 0 1px 0 #555}
.kp{width:80px; height:21px; margin:-10.5px 0 0 -40px; border-radius:2px; background:linear-gradient(180deg, #fbe9cf, var(--cream) 50%, var(--cream2)); color:#7a6650;
  box-shadow:0 0 0 1px #8b7457, 0 3px 3px #000a, inset 0 1px 0 #fff6; font:400 9.5px/21px Arial, sans-serif; text-align:center; white-space:pre}
.kp.red{background:linear-gradient(180deg, #f6826a, var(--red) 50%, var(--red2)); color:#5a1a0d; box-shadow:0 0 0 1px #6a2416, 0 3px 3px #000a, inset 0 1px 0 #fff4}
.kp:active, .kp.dn, .big:active, .big.dn{transform:translateY(1px); filter:brightness(.92)}
.big{width:82px; height:56px; border-radius:3px; font:700 10.5px/1.15 Arial, sans-serif; display:flex; align-items:center; justify-content:center; text-align:center; box-shadow:0 0 0 1px #0008, 0 4px 5px #000b, inset 0 1px 0 #fff6}
.acc{background:linear-gradient(180deg, #9ad8ab, var(--green) 45%, var(--green2)); color:#fff; text-shadow:0 1px 1px #2f6d4290}
.acc.dn{filter:brightness(1.08); box-shadow:0 0 12px #7cff9e66, 0 0 0 1px #0008}
.acc small{position:absolute; left:6px; top:4px; font:700 7px/1 Arial, sans-serif; color:#e9fff0}
.stop{background:linear-gradient(180deg, #a0a3ef, var(--blue) 45%, var(--blue2)); color:#fff}
.start{background:linear-gradient(180deg, #f88b6e, var(--red) 45%, var(--red2)); color:#fff}
.rule{background:#d9d9d9}
/* ---- pads ---- */
.pad{width:80px; height:58px; margin-left:-40px; border-radius:3px; touch-action:none; cursor:pointer;
  background:linear-gradient(180deg, #3a3937, #2c2b29 40%, #262523 80%, #31302e); box-shadow:0 0 0 1.5px #626260, 0 0 0 3px #0a0a0a, 0 5px 6px #000c, inset 0 1px 0 #3a3a3a, inset 0 0 0 4px #00000060}
.pad b{left:9px; top:8px; font:700 7.5px/1 Arial, sans-serif; color:#e8e8e8}
.pad.hit{transform:translateY(2px); box-shadow:0 0 0 1.5px #7a7a7a, 0 0 0 3px #0a0a0a, 0 2px 2px #000c, inset 0 1px 0 #444, inset 0 0 0 4px #00000060}
.pad .fl{inset:0; border-radius:3px; background:#ffffff; opacity:0; pointer-events:none; transition:opacity .12s}
.pad.lit .fl{opacity:.08; transition:none}
.pl{font:700 9px/1.12 Arial, Helvetica, sans-serif; color:var(--print); text-align:center; white-space:nowrap; transform:translateX(-50%)}
/* hint in portrait, messages and file inputs */
#hint{position:fixed; left:0; right:0; bottom:calc(10px + env(safe-area-inset-bottom)); text-align:center; color:#8a8a86; font:12px/1.3 Arial, sans-serif; display:none; pointer-events:none}
#hint svg{vertical-align:middle; margin-right:6px}
.toast{position:fixed; left:50%; top:calc(8px + env(safe-area-inset-top)); transform:translateX(-50%); background:#121212; color:#d6ee6a; padding:8px 12px; border-radius:6px; font:12px/1.3 Arial, sans-serif; max-width:92vw; box-shadow:0 6px 20px #000a; opacity:0; transition:opacity .2s; pointer-events:none; z-index:30}
.toast.show{opacity:1}
</style>
</head>
<body>
<div id="stage"><div id="p">
  <div class="ribs"></div>
  <div class="lip"></div>
  <div class="front"></div>
  <div id="sliders"></div>
  <div class="win"></div>
  <div id="modekeys"></div>
  <div class="lcd" id="lcd" title="Tap left / right half: previous / next item"><div class="row" id="lcd0"></div><div class="row" id="lcd1"></div></div>
  <div id="legend"></div>
  <div class="logo">
        <div class="drp">DIGITAL RHYTHM PROGRAMMER</div>
    <svg width="170" height="50" viewBox="0 0 120 36"><text x="2" y="31" font-family="Arial Black, Arial, Helvetica, sans-serif" font-weight="900" font-size="34" font-style="italic" letter-spacing="1" fill="none" stroke="#f2f2f0" stroke-width="1.3" transform="scale(1.12 1)">RX5</text></svg>
  </div>
  <button class="dice" id="kRandom" title="RANDOMIZE (YES = all)" aria-label="Randomize"><svg viewBox="0 0 24 24"><rect x="3.5" y="3.5" width="17" height="17" rx="3" fill="none" stroke="#222" stroke-width="1.6"/><g fill="#222"><circle cx="8" cy="8" r="1.7"/><circle cx="16" cy="8" r="1.7"/><circle cx="12" cy="12" r="1.7"/><circle cx="8" cy="16" r="1.7"/><circle cx="16" cy="16" r="1.7"/></g></svg><span>RANDOMIZE</span></button>
  <div id="mag" title="Tap a line to open it, anywhere else to close"><div class="legend"></div></div>
  <div id="keys"></div>
  <div id="pads"></div>
</div></div>
<!-- like Omega 110 (CLAUDE.md screen rules): page keys on the side; a page shows every command of a group, big; nothing scrolls -->
<nav id="rail"></nav>
<div id="pageView"></div>
<div id="loupe" title="Tap what you want to use; tap outside to close"><div id="loupeIn"></div></div>
<div id="hint"><svg width="22" height="16" viewBox="0 0 22 16"><rect x="1" y="3" width="13" height="12" rx="2" fill="none" stroke="#8a8a86" stroke-width="1.5"/><path d="M15 2a6 6 0 0 1 5 6" fill="none" stroke="#8a8a86" stroke-width="1.5"/><path d="M18 8h3l-1.5 2z" fill="#8a8a86"/></svg>Turn the phone sideways for a bigger panel</div>
<div class="toast" id="toast"></div>
<input type="file" id="fileIn" hidden>
<script type="module" src="app.js"></script>
</body>
</html>
