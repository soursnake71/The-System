[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "drumscribe"
version = "1.0.0"
description = "Song link in, unquantized drum MIDI out (every kit piece, with velocities)"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.24",
  "scipy>=1.10",
  "soundfile>=0.12",
  "mido>=1.3",
  "yt-dlp>=2025.1.1",
  "torch>=2.1",
  "torchaudio>=2.1",
  "demucs>=4.0.1",
  "audio-separator>=0.30",
  "audioread>=3.0",
]

[project.optional-dependencies]
test = ["pytest>=7"]

[project.scripts]
drumscribe = "drumscribe.__main__:main"
drumscribe-server = "drumscribe.server:main"

[tool.setuptools]
packages = ["drumscribe"]

[tool.setuptools.package-data]
drumscribe = ["web/*.html"]
