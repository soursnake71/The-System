plugins { id 'com.android.application' }
android {
  namespace 'com.thesnakedevice.mkv2mp4'
  compileSdk 35
  defaultConfig {
    applicationId 'com.thesnakedevice.mkv2mp4'
    minSdk 24
    targetSdk 35
    versionCode 3
    versionName '3.0'
    // phones and Google TV devices are ARM; leaving out x86 keeps the APK about half the size
    ndk { abiFilters 'arm64-v8a', 'armeabi-v7a' }
  }
  // store the FFmpeg libraries compressed (much smaller APK; Android unpacks them on install)
  packaging { jniLibs { useLegacyPackaging true } }
  compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
}
// FFmpeg 8 for Android (maintained fork of the retired ffmpeg-kit); GPL build so libx264 is included
dependencies { implementation 'com.antonkarpenko:ffmpeg-kit-full-gpl:2.2.3' }
