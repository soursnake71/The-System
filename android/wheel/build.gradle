plugins { id 'com.android.application' }
// Omega Wheel of Steel: two turntables and a scratch mixer. The engine is native C++ (src/main/cpp, which builds
// plugins/wheel/Engine.cpp + Library.cpp for Android); the UI is plain Android Views drawn on a Canvas.
android {
  namespace 'com.thesnakedevice.wheel'
  compileSdk 35
  buildToolsVersion '35.0.0'
  ndkVersion '27.2.12479018'
  defaultConfig {
    applicationId 'com.thesnakedevice.wheel'
    minSdk 26
    targetSdk 35
    versionCode 3
    versionName '1.2'
    ndk { abiFilters 'arm64-v8a', 'armeabi-v7a', 'x86_64' }
    externalNativeBuild {
      cmake {
        cppFlags '-std=c++17 -O2'
        // the engine must be fast in the debug APK too (it is the one people install)
        arguments '-DCMAKE_BUILD_TYPE=Release'
      }
    }
  }
  externalNativeBuild { cmake { path 'src/main/cpp/CMakeLists.txt'; version '3.22.1' } }
  buildTypes {
    release { minifyEnabled false; signingConfig signingConfigs.debug }
  }
  compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
  lint { abortOnError false; checkReleaseBuilds false }
  // launch test (Robolectric): -PwheelHostLib=<dir with a Linux build of libwheel.so> runs the real engine
  testOptions {
    unitTests {
      includeAndroidResources = true
      all {
        systemProperty 'java.library.path', (findProperty('wheelHostLib') ?: '')
        systemProperty 'robolectric.graphicsMode', 'NATIVE'
        if (findProperty('robolectricRepo')) systemProperty 'robolectric.dependency.repo.url', findProperty('robolectricRepo')
        systemProperty 'wheel.shots', (findProperty('wheelShots') ?: layout.buildDirectory.dir('shots').get().asFile.path)
        testLogging { events 'passed', 'failed'; exceptionFormat 'full'; showStandardStreams true }
      }
    }
  }
}
dependencies {
  testImplementation 'junit:junit:4.13.2'
  testImplementation 'org.robolectric:robolectric:4.14.1'
}
