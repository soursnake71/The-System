plugins { id 'com.android.application' }
android {
  namespace 'com.thesnakedevice.app'
  compileSdk 35
  defaultConfig {
    applicationId 'com.thesnakedevice.app'
    minSdk 24
    targetSdk 35
    versionCode 24
    versionName '24.0'
  }
  buildFeatures { buildConfig true }
  // apps from one project: the full Omega System, Omega Vox (Prophet-5 + vocoder + talking machine), Omega Twelve (12-bit sampler emulator)
  // and Omega DR-110 (the DR-110 circuit model)
  flavorDimensions 'app'
  productFlavors {
    omega {
      dimension 'app'
      manifestPlaceholders = [startUrl:'https://soursnake71.github.io/The-System/']
      buildConfigField 'String', 'START_URL', '"https://soursnake71.github.io/The-System/"'
    }
    vox {
      dimension 'app'
      applicationId 'com.thesnakedevice.vox'
      manifestPlaceholders = [startUrl:'https://soursnake71.github.io/The-System/?app=vox']
      buildConfigField 'String', 'START_URL', '"https://soursnake71.github.io/The-System/?app=vox"'
    }
    twelve {
      dimension 'app'
      applicationId 'com.thesnakedevice.twelve'
      manifestPlaceholders = [startUrl:'https://soursnake71.github.io/The-System/twelve/']
      buildConfigField 'String', 'START_URL', '"https://soursnake71.github.io/The-System/twelve/"'
    }
    dr110 {
      dimension 'app'
      applicationId 'com.thesnakedevice.dr110'
      manifestPlaceholders = [startUrl:'https://soursnake71.github.io/The-System/dr110/']
      buildConfigField 'String', 'START_URL', '"https://soursnake71.github.io/The-System/dr110/"'
      buildConfigField 'String', 'BRAND_QUERY', '""'
    }
    // JayQuan-110: the same machine for a friend, with his logo and name (installs next to Omega 110)
    jayquan {
      dimension 'app'
      applicationId 'com.thesnakedevice.jayquan110'
      manifestPlaceholders = [startUrl:'https://soursnake71.github.io/The-System/dr110/?brand=jayquan']
      buildConfigField 'String', 'START_URL', '"https://soursnake71.github.io/The-System/dr110/?brand=jayquan"'
      buildConfigField 'String', 'BRAND_QUERY', '"?brand=jayquan"'
    }
  }
  signingConfigs {
    release {
      storeFile file(System.getenv('SNAKE_KEYSTORE') ?: 'missing.jks')
      storePassword System.getenv('SNAKE_KEYPASS') ?: ''
      keyAlias 'snake'
      keyPassword System.getenv('SNAKE_KEYPASS') ?: ''
    }
  }
  buildTypes { release { minifyEnabled false; signingConfig signingConfigs.release } }
  compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
}
dependencies {
  implementation 'com.google.androidbrowserhelper:androidbrowserhelper:2.5.0'
  twelveImplementation 'androidx.webkit:webkit:1.12.1'
  dr110Implementation 'androidx.webkit:webkit:1.12.1'
  jayquanImplementation 'androidx.webkit:webkit:1.12.1'
}

// Omega Twelve carries the web app inside the APK: copy ../twelve (the app's files, not its tools) into its assets
def twelveAssets = layout.buildDirectory.dir('twelveAssets')
tasks.register('copyTwelveWeb', Copy) {
  from('../../twelve') { exclude 'tools/**', '*.md' }
  into twelveAssets.map { it.dir('twelve') }
}
android.sourceSets.twelve.assets.srcDirs += [twelveAssets]
tasks.matching { it.name.startsWith('merge') && it.name.contains('Twelve') && it.name.endsWith('Assets') }.configureEach { dependsOn 'copyTwelveWeb' }

// Omega DR-110 carries its web app inside the APK too: ../dr110 (not its tools) into its assets
def dr110Assets = layout.buildDirectory.dir('dr110Assets')
tasks.register('copyDr110Web', Copy) {
  from('../../dr110') { exclude 'tools/**', '*.md' }
  into dr110Assets.map { it.dir('dr110') }
}
android.sourceSets.dr110.assets.srcDirs += [dr110Assets]
// JayQuan-110 runs the same web app and activity as Omega 110, with its own name, icon and manifest
android.sourceSets.jayquan.assets.srcDirs += [dr110Assets]
android.sourceSets.jayquan.java.srcDirs += ['src/dr110/java']
tasks.matching { it.name.startsWith('merge') && (it.name.contains('Dr110') || it.name.contains('Jayquan')) && it.name.endsWith('Assets') }.configureEach { dependsOn 'copyDr110Web' }
