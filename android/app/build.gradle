plugins { id 'com.android.application' }
android {
  namespace 'com.thesnakedevice.app'
  compileSdk 35
  defaultConfig {
    applicationId 'com.thesnakedevice.app'
    minSdk 24
    targetSdk 35
    versionCode 12
    versionName '12.0'
  }
  buildFeatures { buildConfig true }
  // two apps from one project: the full Omega System, and Omega Vox (Prophet-5 + vocoder + talking machine)
  flavorDimensions 'app'
  productFlavors {
    omega {
      dimension 'app'
      manifestPlaceholders = [startUrl:'https://soursnake71.github.io/The-System/']
      buildConfigField 'String', 'START_URL', '"https://soursnake71.github.io/The-System/"'
    }
    vox {
      dimension 'app'
      applicationId 'com.thesnakedevice.vox'
      manifestPlaceholders = [startUrl:'https://soursnake71.github.io/The-System/?app=vox']
      buildConfigField 'String', 'START_URL', '"https://soursnake71.github.io/The-System/?app=vox"'
    }
  }
  signingConfigs {
    release {
      storeFile file(System.getenv('SNAKE_KEYSTORE') ?: 'missing.jks')
      storePassword System.getenv('SNAKE_KEYPASS') ?: ''
      keyAlias 'snake'
      keyPassword System.getenv('SNAKE_KEYPASS') ?: ''
    }
  }
  buildTypes { release { minifyEnabled false; signingConfig signingConfigs.release } }
  compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
}
dependencies { implementation 'com.google.androidbrowserhelper:androidbrowserhelper:2.5.0' }
