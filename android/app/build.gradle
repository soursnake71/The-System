plugins { id 'com.android.application' }
android {
  namespace 'com.thesnakedevice.app'
  compileSdk 35
  defaultConfig {
    applicationId 'com.thesnakedevice.app'
    minSdk 24
    targetSdk 35
    versionCode 22
    versionName '22.0'
  }
  buildFeatures { buildConfig true }
  // apps from one project: the full Omega System, Omega Vox (Prophet-5 + vocoder + talking machine) and Omega Twelve (12-bit sampler emulator)
  flavorDimensions 'app'
  productFlavors {
    omega {
      dimension 'app'
      manifestPlaceholders = [startUrl:'https://soursnake71.github.io/The-System/']
      buildConfigField 'String', 'START_URL', '"https://soursnake71.github.io/The-System/"'
    }
    vox {
      dimension 'app'
      applicationId 'com.thesnakedevice.vox'
      manifestPlaceholders = [startUrl:'https://soursnake71.github.io/The-System/?app=vox']
      buildConfigField 'String', 'START_URL', '"https://soursnake71.github.io/The-System/?app=vox"'
    }
    twelve {
      dimension 'app'
      applicationId 'com.thesnakedevice.twelve'
      manifestPlaceholders = [startUrl:'https://soursnake71.github.io/The-System/twelve/']
      buildConfigField 'String', 'START_URL', '"https://soursnake71.github.io/The-System/twelve/"'
    }
  }
  signingConfigs {
    release {
      storeFile file(System.getenv('SNAKE_KEYSTORE') ?: 'missing.jks')
      storePassword System.getenv('SNAKE_KEYPASS') ?: ''
      keyAlias 'snake'
      keyPassword System.getenv('SNAKE_KEYPASS') ?: ''
    }
  }
  buildTypes { release { minifyEnabled false; signingConfig signingConfigs.release } }
  compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
}
dependencies {
  implementation 'com.google.androidbrowserhelper:androidbrowserhelper:2.5.0'
  twelveImplementation 'androidx.webkit:webkit:1.12.1'
}

// Omega Twelve carries the web app inside the APK: copy ../twelve (the app's files, not its tools) into its assets
def twelveAssets = layout.buildDirectory.dir('twelveAssets')
tasks.register('copyTwelveWeb', Copy) {
  from('../../twelve') { exclude 'tools/**', '*.md' }
  into twelveAssets.map { it.dir('twelve') }
}
android.sourceSets.twelve.assets.srcDirs += [twelveAssets]
tasks.matching { it.name.startsWith('merge') && it.name.contains('Twelve') && it.name.endsWith('Assets') }.configureEach { dependsOn 'copyTwelveWeb' }
