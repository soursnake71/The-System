// Omega Synsonics for Android: a NativeActivity, all C++ (src/main/cpp/main.cpp + ../../core). No Java code.
plugins { id 'com.android.application' }
android {
  namespace 'com.thesnakedevice.synsonics'
  compileSdk 35
  ndkVersion '27.2.12479018'
  defaultConfig {
    applicationId 'com.thesnakedevice.synsonics'
    minSdk 26          // AAudio
    targetSdk 35
    versionCode 1
    versionName '1.0'
    ndk { abiFilters 'arm64-v8a', 'armeabi-v7a', 'x86_64' }
    externalNativeBuild { cmake { arguments '-DANDROID_STL=c++_static' } }
  }
  externalNativeBuild { cmake { path 'src/main/cpp/CMakeLists.txt'; version '3.22.1' } }
  // A sideload key kept in the repo (its password is public): every build is signed the same way, so a new APK
  // installs over the old one and keeps your memories.
  signingConfigs {
    sideload { storeFile file('synsonics-sideload.jks'); storePassword 'android'; keyAlias 'synsonics'; keyPassword 'android' }
  }
  buildTypes {
    release { minifyEnabled false; signingConfig signingConfigs.sideload }   // optimized DSP
    debug { signingConfig signingConfigs.sideload }
  }
}
